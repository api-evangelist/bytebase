components:
  schemas:
    google.protobuf.Timestamp:
      type: string
      examples:
      - '2023-01-15T01:30:15.01Z'
      - '2024-12-25T12:00:00Z'
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    bytebase.v1.BatchCreateRevisionsResponse:
      type: object
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Revision'
          title: revisions
          description: The created revisions.
      title: BatchCreateRevisionsResponse
      additionalProperties: false
    bytebase.v1.ListRevisionsResponse:
      type: object
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Revision'
          title: revisions
          description: The revisions from the specified request.
        nextPageToken:
          type: string
          title: next_page_token
          description: "A token, which can be sent as `page_token` to retrieve the next page.\n If this field is omitted, there are no subsequent pages."
      title: ListRevisionsResponse
      additionalProperties: false
    bytebase.v1.CreateRevisionRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: 'Format: instances/{instance}/databases/{database} or projects/{project}/instances/{instance}/databases/{database}'
        revision:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.Revision'
          title: revision
          description: The revision to create.
      title: CreateRevisionRequest
      required:
      - parent
      - revision
      additionalProperties: false
    google.protobuf.Empty:
      type: object
      description: An empty JSON object.
    bytebase.v1.Revision.Type:
      type: string
      title: Type
      enum:
      - TYPE_UNSPECIFIED
      - VERSIONED
      - DECLARATIVE
      description: The type of schema revision.
    bytebase.v1.Revision:
      type: object
      properties:
        name:
          type: string
          title: name
          description: 'Format: instances/{instance}/databases/{database}/revisions/{revision} or projects/{project}/instances/{instance}/databases/{database}/revisions/{revision}'
        release:
          type: string
          title: release
          description: "Format: projects/{project}/releases/{release}\n Can be empty."
        createTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          readOnly: true
        deleter:
          type: string
          title: deleter
          description: "Format: users/hello@world.com\n Can be empty."
          readOnly: true
        deleteTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: delete_time
          description: Can be empty.
          readOnly: true
        file:
          type: string
          title: file
          description: "Format: projects/{project}/releases/{release}/files/{file_path}\n The file_path segment is URL-encoded since file paths may contain \"/\".\n Can be empty."
        version:
          type: string
          title: version
          description: The schema version string for this revision.
        sheet:
          type: string
          title: sheet
          description: "The sheet that holds the content.\n Format: projects/{project}/sheets/{sheet}"
        sheetSha256:
          type: string
          title: sheet_sha256
          description: The SHA256 hash value of the sheet.
          readOnly: true
        taskRun:
          type: string
          title: task_run
          description: "The task run associated with the revision.\n Can be empty.\n Format: projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns/{taskRun}"
        type:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.Revision.Type'
          title: type
          description: The type of the revision.
      title: Revision
      additionalProperties: false
