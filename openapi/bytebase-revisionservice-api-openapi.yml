openapi: 3.2.0
info:
  title: Bytebase API Reference Revision Service API
  description: API reference for Bytebase. Every endpoint is served by your own Bytebase instance.
  version: 1.0.0
security: []
tags:
- name: RevisionService
  description: RevisionService manages schema revision history.
paths:
  /v1/instances/{instance}/databases/{database}/revisions:
    get:
      tags:
      - RevisionService
      summary: ListRevisions
      description: 'Lists schema revisions for a database.

        Permissions required: bb.revisions.list'
      operationId: RevisionService_ListRevisions
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: "The maximum number of revisions to return. The service may return fewer\n than this value. If unspecified, at most 10 revisions will be returned. The\n maximum value is 1000; values above 1000 will be coerced to 1000."
        schema:
          type: integer
          title: page_size
          format: int32
      - name: pageToken
        in: query
        description: "A page token, received from a previous `ListRevisions` call.\n Provide this to retrieve the subsequent page.\n\n When paginating, all other parameters provided to `ListRevisions` must\n match the call that provided the page token."
        schema:
          type: string
          title: page_token
      - name: showDeleted
        in: query
        description: Whether to include deleted revisions in the results.
        schema:
          type: boolean
          title: show_deleted
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListRevisionsResponse'
  /v1/instances/{instance}/databases/{database}/revisions/{revision}:
    get:
      tags:
      - RevisionService
      summary: GetRevision
      description: 'Retrieves a schema revision by name.

        Permissions required: bb.revisions.get'
      operationId: RevisionService_GetRevision
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: revision
        in: path
        description: The revision id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Revision'
    delete:
      tags:
      - RevisionService
      summary: DeleteRevision
      description: 'Deletes a schema revision.

        Permissions required: bb.revisions.delete'
      operationId: RevisionService_DeleteRevision
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: revision
        in: path
        description: The revision id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /v1/instances/{instance}/databases/{database}/revisions:batchCreate:
    post:
      tags:
      - RevisionService
      summary: BatchCreateRevisions
      description: 'Creates multiple schema revisions in a single operation.

        Permissions required: bb.revisions.create'
      operationId: RevisionService_BatchCreateRevisions
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requests:
                  type: array
                  items:
                    $ref: '#/components/schemas/bytebase.v1.CreateRevisionRequest'
                  title: requests
                  description: "The request message specifying the revisions to create.\n A maximum of 100 revisions can be created in a batch."
              title: BatchCreateRevisionsRequest
              required:
              - requests
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.BatchCreateRevisionsResponse'
  /v1/projects/{project}/instances/{instance}/databases/{database}/revisions:
