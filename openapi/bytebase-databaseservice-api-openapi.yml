      - RANGE_COLUMNS
      - LIST
      - LIST_COLUMNS
      - HASH
      - LINEAR_HASH
      - KEY
      - LINEAR_KEY
      description: "Type is the type of a table partition, some database engines may not\n support all types. Only avilable for the following database engines now:\n MySQL: RANGE, RANGE COLUMNS, LIST, LIST COLUMNS, HASH, LINEAR HASH, KEY,\n LINEAR_KEY\n (https://dev.mysql.com/doc/refman/8.0/en/partitioning-types.html) TiDB:\n RANGE, RANGE COLUMNS, LIST, LIST COLUMNS, HASH, KEY PostgreSQL: RANGE,\n LIST, HASH (https://www.postgresql.org/docs/current/ddl-partitioning.html)"
