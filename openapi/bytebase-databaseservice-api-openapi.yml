  /v1/projects/{project}/databases:
    get:
      tags:
      - DatabaseService
      summary: ListDatabases
      description: 'Lists databases in a project, instance, or workspace.

        Permissions required: bb.projects.get (for project parent), bb.databases.list (for workspace parent), or bb.instances.get (for instance parent)'
      operationId: DatabaseService_ListDatabases
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: "The maximum number of databases to return. The service may return fewer\n than this value.\n If unspecified, at most 10 databases will be returned.\n The maximum value is 1000; values above 1000 will be coerced to 1000."
        schema:
          type: integer
          title: page_size
          format: int32
      - name: pageToken
        in: query
        description: "A page token, received from a previous `ListDatabases` call.\n Provide this to retrieve the subsequent page.\n\n When paginating, all other parameters provided to `ListDatabases` must\n match the call that provided the page token."
        schema:
          type: string
          title: page_token
      - name: filter
        in: query
        description: "Filter is used to filter databases returned in the list.\n The syntax and semantics of CEL are documented at https://github.com/google/cel-spec\n\n Supported filter:\n - environment: the environment full name in \"environments/{id}\" format, support \"==\" operator.\n - name: the database name, support \".contains()\" operator.\n - project: the project full name in \"projects/{id}\" format, support \"==\" operator.\n - instance: the instance full name in \"instances/{id}\" or \"projects/{project}/instances/{id}\" format, support \"==\" operator.\n - engine: the database engine, check Engine enum for values. Support \"==\", \"in [xx]\", \"!(in [xx])\" operator.\n - exclude_unassigned: should be \"true\" or \"false\", will not show unassigned databases if it's true, support \"==\" operator.\n - table: filter by the database table, support \"==\" and \".contains()\" operator.\n - labels.{key}: the database label, support \"==\" and \"in\" operators.\n\n For example:\n environment == \"environments/{environment resource id}\"\n environment == \"\" (find databases which environment is not set)\n project == \"projects/{project resource id}\"\n instance == \"instances/{instance resource id}\"\n instance == \"projects/{project resource id}/instances/{instance resource id}\"\n name.contains(\"database name\")\n engine == \"MYSQL\"\n engine in [\"MYSQL\", \"POSTGRES\"]\n !(engine in [\"MYSQL\", \"POSTGRES\"])\n exclude_unassigned == true\n table == \"sample\"\n table.contains(\"sam\")\n labels.environment == \"production\"\n labels.region == \"asia\"\n labels.region in [\"asia\", \"europe\"]\n\n You can combine filter conditions like:\n environment == \"environments/prod\" && name.contains(\"employee\")"
        schema:
          type: string
          title: filter
      - name: showDeleted
        in: query
        description: Show deleted database if specified.
        schema:
          type: boolean
          title: show_deleted
      - name: orderBy
        in: query
        description: "The order by of databases.\n Support name, project, instance. The default sorting order is ascending.\n For example:\n - order_by = \"name\" - order by name ascending\n - order_by = \"name desc\"\n - order_by = \"name desc, project asc\""
        schema:
          type: string
          title: order_by
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListDatabasesResponse'
  /v1/projects/{project}/databases:batchGet:
