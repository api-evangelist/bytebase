openapi: 3.2.0
info:
  title: Bytebase API Reference Database Service API
  description: API reference for Bytebase. Every endpoint is served by your own Bytebase instance.
  version: 1.0.0
security: []
tags:
- name: DatabaseService
  description: DatabaseService manages databases and their schemas.
paths:
  /v1/instances/{instance}/databases:
    get:
      tags:
      - DatabaseService
      summary: ListDatabases
      description: 'Lists databases in a project, instance, or workspace.

        Permissions required: bb.projects.get (for project parent), bb.databases.list (for workspace parent), or bb.instances.get (for instance parent)'
      operationId: DatabaseService_ListDatabases2
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: "The maximum number of databases to return. The service may return fewer\n than this value.\n If unspecified, at most 10 databases will be returned.\n The maximum value is 1000; values above 1000 will be coerced to 1000."
        schema:
          type: integer
          title: page_size
          format: int32
      - name: pageToken
        in: query
        description: "A page token, received from a previous `ListDatabases` call.\n Provide this to retrieve the subsequent page.\n\n When paginating, all other parameters provided to `ListDatabases` must\n match the call that provided the page token."
        schema:
          type: string
          title: page_token
      - name: filter
        in: query
        description: "Filter is used to filter databases returned in the list.\n The syntax and semantics of CEL are documented at https://github.com/google/cel-spec\n\n Supported filter:\n - environment: the environment full name in \"environments/{id}\" format, support \"==\" operator.\n - name: the database name, support \".contains()\" operator.\n - project: the project full name in \"projects/{id}\" format, support \"==\" operator.\n - instance: the instance full name in \"instances/{id}\" or \"projects/{project}/instances/{id}\" format, support \"==\" operator.\n - engine: the database engine, check Engine enum for values. Support \"==\", \"in [xx]\", \"!(in [xx])\" operator.\n - exclude_unassigned: should be \"true\" or \"false\", will not show unassigned databases if it's true, support \"==\" operator.\n - table: filter by the database table, support \"==\" and \".contains()\" operator.\n - labels.{key}: the database label, support \"==\" and \"in\" operators.\n\n For example:\n environment == \"environments/{environment resource id}\"\n environment == \"\" (find databases which environment is not set)\n project == \"projects/{project resource id}\"\n instance == \"instances/{instance resource id}\"\n instance == \"projects/{project resource id}/instances/{instance resource id}\"\n name.contains(\"database name\")\n engine == \"MYSQL\"\n engine in [\"MYSQL\", \"POSTGRES\"]\n !(engine in [\"MYSQL\", \"POSTGRES\"])\n exclude_unassigned == true\n table == \"sample\"\n table.contains(\"sam\")\n labels.environment == \"production\"\n labels.region == \"asia\"\n labels.region in [\"asia\", \"europe\"]\n\n You can combine filter conditions like:\n environment == \"environments/prod\" && name.contains(\"employee\")"
        schema:
          type: string
          title: filter
      - name: showDeleted
        in: query
        description: Show deleted database if specified.
        schema:
          type: boolean
          title: show_deleted
      - name: orderBy
        in: query
        description: "The order by of databases.\n Support name, project, instance. The default sorting order is ascending.\n For example:\n - order_by = \"name\" - order by name ascending\n - order_by = \"name desc\"\n - order_by = \"name desc, project asc\""
        schema:
          type: string
          title: order_by
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListDatabasesResponse'
  /v1/instances/{instance}/databases/{database}:
    get:
      tags:
      - DatabaseService
      summary: GetDatabase
      description: 'Retrieves a database by name.

        Permissions required: bb.databases.get'
      operationId: DatabaseService_GetDatabase
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Database'
    patch:
      tags:
      - DatabaseService
      summary: UpdateDatabase
      description: 'Updates database properties such as labels and project assignment.

        Permissions required: bb.databases.update'
      operationId: DatabaseService_UpdateDatabase
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: updateMask
        in: query
        description: The list of fields to update.
        schema:
          type: string
      requestBody:
        description: "The database to update.\n\n The database's `name` field is used to identify the database to update.\n Format: instances/{instance}/databases/{database} or projects/{project}/instances/{instance}/databases/{database}"
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.Database'
              title: database
              description: "The database to update.\n\n The database's `name` field is used to identify the database to update.\n Format: instances/{instance}/databases/{database} or projects/{project}/instances/{instance}/databases/{database}"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Database'
  /v1/instances/{instance}/databases/{database}/changelogs/{changelog}:diffSchema:
    post:
      tags:
      - DatabaseService
      summary: DiffSchema
      description: 'Compares and generates migration statements between two schemas.

        Permissions required: bb.databases.get'
      operationId: DatabaseService_DiffSchema3
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: changelog
        in: path
        description: The changelog id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              anyOf:
              - type: object
                properties:
                  changelog:
                    type: string
                    title: changelog
                    description: "The resource name of the changelog\n Format:\n instances/{instance}/databases/{database}/changelogs/{changelog} or projects/{project}/instances/{instance}/databases/{database}/changelogs/{changelog}"
                title: changelog
              - type: object
                properties:
                  schema:
                    type: string
                    title: schema
                    description: The target schema.
                title: schema
              unevaluatedProperties: false
              not:
                allOf:
                - anyOf:
                  - required:
                    - changelog
                  - required:
                    - schema
                - not:
                    oneOf:
                    - required:
                      - changelog
                    - required:
                      - schema
              title: DiffSchemaRequest
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.DiffSchemaResponse'
  /v1/instances/{instance}/databases/{database}/metadata:
    get:
      tags:
      - DatabaseService
      summary: GetDatabaseMetadata
      description: 'Retrieves database metadata including tables, columns, and indexes.

        Permissions required: bb.databases.getSchema'
      operationId: DatabaseService_GetDatabaseMetadata
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: "Filter is used to filter databases returned in the list.\n The syntax and semantics of CEL are documented at https://github.com/google/cel-spec\n\n Supported filter:\n - schema: the schema name, support \"==\" operator.\n - table: the table name, support \"==\" and \".contains()\" operator.\n\n For example:\n schema == \"schema-a\"\n table == \"table-a\"\n table.contains(\"table-a\")\n schema == \"schema-a\" && table.contains(\"sample\")\n The filter is used to search for tables containing \"sample\" in the schema \"schemas/schema-a\".\n The column masking level will only be returned when a table filter is used."
        schema:
          type: string
          title: filter
      - name: limit
        in: query
        description: "Limit the response size of returned table metadata per schema.\n For example, if the database has 3 schemas, and each schema has 100 tables,\n if limit is 20, then only 20 tables will be returned for each schema, total 60 tables.\n Default 0, means no limit."
        schema:
          type: integer
          title: limit
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.DatabaseMetadata'
  /v1/instances/{instance}/databases/{database}/schema:
    get:
      tags:
      - DatabaseService
      summary: GetDatabaseSchema
      description: 'Retrieves database schema as DDL statements.

        Permissions required: bb.databases.getSchema'
      operationId: DatabaseService_GetDatabaseSchema
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.DatabaseSchema'
  /v1/instances/{instance}/databases/{database}/schemaString:
    get:
      tags:
      - DatabaseService
      summary: GetSchemaString
      description: 'Generates schema DDL for a database object.

        Permissions required: bb.databases.getSchema'
      operationId: DatabaseService_GetSchemaString
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: The type query parameter.
        schema:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.GetSchemaStringRequest.ObjectType'
          title: type
      - name: schema
        in: query
        description: It's empty for DATABASE.
        schema:
          type: string
          title: schema
      - name: object
        in: query
        description: It's empty for DATABASE and SCHEMA.
        schema:
          type: string
          title: object
      - name: metadata.name
        in: query
        description: "The database metadata name.\n\n Format: instances/{instance}/databases/{database}/metadata or projects/{project}/instances/{instance}/databases/{database}/metadata"
        schema:
          type: string
          title: name
      - name: metadata.schemas.name
        in: query
        description: "The name is the schema name.\n It is an empty string for databases without such concept such as MySQL."
        schema:
          type: string
          title: name
      - name: metadata.schemas.tables.name
        in: query
        description: The name is the name of a table.
        schema:
          type: string
          title: name
      - name: metadata.schemas.tables.columns.name
        in: query
        description: The name is the name of a column.
        schema:
          type: string
          title: name
      - name: metadata.schemas.tables.columns.position
        in: query
        description: The position is the position in columns.
        schema:
          type: integer
          title: position
          format: int32
      - name: metadata.schemas.tables.columns.hasDefault
        in: query
        description: The metadata.schemas.tables.columns.hasDefault query parameter.
        schema:
          type: boolean
          title: has_default
      - name: metadata.schemas.tables.columns.default
        in: query
        description: The default value of column.
        schema:
          type: string
          title: default
      - name: metadata.schemas.tables.columns.defaultOnNull
        in: query
        description: "Oracle specific metadata.\n The default_on_null is the default on null of a column."
        schema:
          type: boolean
          title: default_on_null
      - name: metadata.schemas.tables.columns.onUpdate
        in: query
        description: "The on_update is the on update action of a column.\n For MySQL like databases, it's only supported for TIMESTAMP columns with\n CURRENT_TIMESTAMP as on update value."
        schema:
          type: string
          title: on_update
      - name: metadata.schemas.tables.columns.nullable
        in: query
        description: The nullable is the nullable of a column.
        schema:
          type: boolean
          title: nullable
      - name: metadata.schemas.tables.columns.type
        in: query
        description: The type is the type of a column.
        schema:
          type: string
          title: type
      - name: metadata.schemas.tables.columns.characterSet
        in: query
        description: The character_set is the character_set of a column.
        schema:
          type: string
          title: character_set
      - name: metadata.schemas.tables.columns.collation
        in: query
        description: The collation is the collation of a column.
        schema:
          type: string
          title: collation
      - name: metadata.schemas.tables.columns.comment
        in: query
        description: The comment is the comment of a column.
        schema:
          type: string
          title: comment
      - name: metadata.schemas.tables.columns.generation.type
        in: query
        description: The metadata.schemas.tables.columns.generation.type query parameter.
        schema:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.GenerationMetadata.Type'
          title: type
      - name: metadata.schemas.tables.columns.generation.expression
        in: query
        description: The metadata.schemas.tables.columns.generation.expression query parameter.
        schema:
          type: string
          title: expression
      - name: metadata.schemas.tables.columns.isIdentity
        in: query
        description: The metadata.schemas.tables.columns.isIdentity query parameter.
        schema:
          type: boolean
          title: is_identity
      - name: metadata.schemas.tables.columns.identityGeneration
        in: query
        description: The identity_generation is for identity columns, PG only.
        schema:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.ColumnMetadata.IdentityGeneration'
          title: identity_generation
      - name: metadata.schemas.tables.columns.identitySeed
        in: query
        description: The identity_seed is for identity columns, MSSQL only.
        schema:
          type: string
          title: identity_seed
          format: int64
      - name: metadata.schemas.tables.columns.identityIncrement
        in: query
        description: The identity_increment is for identity columns, MSSQL only.
        schema:
          type: string
          title: identity_increment
          format: int64
      - name: metadata.schemas.tables.columns.defaultConstraintName
        in: query
        description: "The default_constraint_name is the name of the default constraint, MSSQL only.\n In MSSQL, default values are implemented as named constraints. When modifying or\n dropping a column's default value, you must reference the constraint by name.\n This field stores the actual constraint name from the database.\n\n Example: A column definition like:\n   CREATE TABLE employees (\n     status NVARCHAR(20) DEFAULT 'active'\n   )\n\n Will create a constraint with an auto-generated name like 'DF__employees__statu__3B75D760'\n or a user-defined name if specified:\n   ALTER TABLE employees ADD CONSTRAINT DF_employees_status DEFAULT 'active' FOR status\n\n To modify the default, you must first drop the existing constraint by name:\n   ALTER TABLE employees DROP CONSTRAINT DF__employees__statu__3B75D760\n   ALTER TABLE employees ADD CONSTRAINT DF_employees_status DEFAULT 'inactive' FOR status\n\n This field is populated when syncing from the database. When empty (e.g., when parsing\n from SQL files), the system cannot automatically drop the constraint."
        schema:
          type: string
          title: default_constraint_name
      - name: metadata.schemas.tables.columns.srid
        in: query
        description: "The spatial reference system identifier of a spatial column, MySQL 8.0 only.\n Unset means the column declares no SRID; presence carries the explicit SRID,\n including the valid SRID 0. SRS_IDs are unsigned 32-bit (custom SRSs may exceed\n int32)."
        schema:
          type: integer
          title: srid
      - name: metadata.schemas.tables.columns.isInvisible
        in: query
        description: Whether the column is invisible (hidden from SELECT *), MySQL 8.0.23+ only.
        schema:
          type: boolean
          title: is_invisible
      - name: metadata.schemas.tables.indexes.name
        in: query
        description: The name is the name of an index.
        schema:
          type: string
          title: name
      - name: metadata.schemas.tables.indexes.expressions
        in: query
        description: "The expressions are the ordered columns or expressions of an index.\n This could refer to a column or an expression."
        schema:
          type: array
          items:
            type: string
          title: expressions
      - name: metadata.schemas.tables.indexes.keyLength
        in: query
        description: "The key_lengths are the ordered key lengths of an index.\n If the key length is not specified, it's -1."
        schema:
          type: array
          items:
            type: string
            format: int64
          title: key_length
      - name: metadata.schemas.tables.indexes.descending
        in: query
        description: The descending is the ordered descending of an index.
        schema:
          type: array
          items:
            type: boolean
          title: descending
      - name: metadata.schemas.tables.indexes.type
        in: query
        description: The type is the type of an index.
        schema:
          type: string
          title: type
      - name: metadata.schemas.tables.indexes.unique
        in: query
        description: The unique is whether the index is unique.
        schema:
          type: boolean
          title: unique
      - name: metadata.schemas.tables.indexes.primary
        in: query
        description: The primary is whether the index is a primary key index.
        schema:
          type: boolean
          title: primary
      - name: metadata.schemas.tables.indexes.visible
        in: query
        description: The visible is whether the index is visible.
        schema:
          type: boolean
          title: visible
      - name: metadata.schemas.tables.indexes.comment
        in: query
        description: The comment is the comment of an index.
        schema:
          type: string
          title: comment
      - name: metadata.schemas.tables.indexes.definition
        in: query
        description: The definition of an index.
        schema:
          type: string
          title: definition
      - name: metadata.schemas.tables.indexes.parentIndexSchema
        in: query
        description: The schema name of the parent index.
        schema:
          type: string
          title: parent_index_schema
      - name: metadata.schemas.tables.indexes.parentIndexName
        in: query
        description: The index name of the parent index.
        schema:
          type: string
          title: parent_index_name
      - name: metadata.schemas.tables.indexes.granularity
        in: query
        description: The number of granules in the block. It's a ClickHouse specific field.
        schema:
          type: string
          title: granularity
          format: int64
      - name: metadata.schemas.tables.indexes.isConstraint
        in: query
        description: "It's a PostgreSQL specific field.\n The unique constraint and unique index are not the same thing in PostgreSQL."
        schema:
          type: boolean
          title: is_constraint
      - name: metadata.schemas.tables.indexes.spatialConfig.method
        in: query
        description: Spatial indexing method (e.g., "SPATIAL", "R-TREE", "GIST")
        schema:
          type: string
          title: method
      - name: metadata.schemas.tables.indexes.spatialConfig.tessellation.scheme
        in: query
        description: Tessellation scheme (e.g., "GEOMETRY_GRID", "GEOGRAPHY_GRID", "GEOMETRY_AUTO_GRID")
        schema:
          type: string
          title: scheme
      - name: metadata.schemas.tables.indexes.spatialConfig.tessellation.gridLevels.level
        in: query
        description: Grid level number (1-4 for SQL Server)
        schema:
          type: integer
          title: level
          format: int32
      - name: metadata.schemas.tables.indexes.spatialConfig.tessellation.gridLevels.density
        in: query
        description: Grid density (LOW, MEDIUM, HIGH)
        schema:
          type: string
          title: density
      - name: metadata.schemas.tables.indexes.spatialConfig.tessellation.cellsPerObject
        in: query
        description: Number of cells per object (1-8192 for SQL Server)
        schema:
          type: integer
          title: cells_per_object
          format: int32
      - name: metadata.schemas.tables.indexes.spatialConfig.tessellation.boundingBox.xmin
        in: query
        description: Minimum X coordinate
        schema:
          type: number
          title: xmin
          format: double
      - name: metadata.schemas.tables.indexes.spatialConfig.tessellation.boundingBox.ymin
        in: query
        description: Minimum Y coordinate
        schema:
          type: number
          title: ymin
          format: double
      - name: metadata.schemas.tables.indexes.spatialConfig.tessellation.boundingBox.xmax
        in: query
        description: Maximum X coordinate
        schema:
          type: number
          title: xmax
          format: double
      - name: metadata.schemas.tables.indexes.spatialConfig.tessellation.boundingBox.ymax
        in: query
        description: Maximum Y coordinate
        schema:
          type: number
          title: ymax
          format: double
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.fillfactor
        in: query
        description: Fill factor percentage (1-100)
        schema:
          type: integer
          title: fillfactor
          format: int32
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.buffering
        in: query
        description: Buffering mode for PostgreSQL (auto, on, off)
        schema:
          type: string
          title: buffering
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.tablespace
        in: query
        description: Tablespace configuration for Oracle
        schema:
          type: string
          title: tablespace
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.workTablespace
        in: query
        description: The metadata.schemas.tables.indexes.spatialConfig.storage.workTablespace query parameter.
        schema:
          type: string
          title: work_tablespace
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.sdoLevel
        in: query
        description: The metadata.schemas.tables.indexes.spatialConfig.storage.sdoLevel query parameter.
        schema:
          type: integer
          title: sdo_level
          format: int32
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.commitInterval
        in: query
        description: The metadata.schemas.tables.indexes.spatialConfig.storage.commitInterval query parameter.
        schema:
          type: integer
          title: commit_interval
          format: int32
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.padIndex
        in: query
        description: SQL Server specific parameters
        schema:
          type: boolean
          title: pad_index
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.sortInTempdb
        in: query
        description: ON, OFF
        schema:
          type: string
          title: sort_in_tempdb
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.dropExisting
        in: query
        description: The metadata.schemas.tables.indexes.spatialConfig.storage.dropExisting query parameter.
        schema:
          type: boolean
          title: drop_existing
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.online
        in: query
        description: The metadata.schemas.tables.indexes.spatialConfig.storage.online query parameter.
        schema:
          type: boolean
          title: online
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.allowRowLocks
        in: query
        description: The metadata.schemas.tables.indexes.spatialConfig.storage.allowRowLocks query parameter.
        schema:
          type: boolean
          title: allow_row_locks
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.allowPageLocks
        in: query
        description: The metadata.schemas.tables.indexes.spatialConfig.storage.allowPageLocks query parameter.
        schema:
          type: boolean
          title: allow_page_locks
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.maxdop
        in: query
        description: The metadata.schemas.tables.indexes.spatialConfig.storage.maxdop query parameter.
        schema:
          type: integer
          title: maxdop
          format: int32
      - name: metadata.schemas.tables.indexes.spatialConfig.storage.dataCompression
        in: query
        description: NONE, ROW, PAGE
        schema:
          type: string
          title: data_compression
      - name: metadata.schemas.tables.indexes.spatialConfig.dimensional.dimensions
        in: query
        description: Number of dimensions (2-4, default 2)
        schema:
          type: integer
          title: dimensions
          format: int32
      - name: metadata.schemas.tables.indexes.spatialConfig.dimensional.dataType
        in: query
        description: Spatial data type (GEOMETRY, GEOGRAPHY, POINT, POLYGON, etc.)
        schema:
          type: string
          title: data_type
      - name: metadata.schemas.tables.indexes.spatialConfig.dimensional.srid
        in: query
        description: Spatial reference system identifier (SRID)
        schema:
          type: integer
          title: srid
          format: int32
      - name: metadata.schemas.tables.indexes.spatialConfig.dimensional.constraints.dimension
        in: query
        description: Dimension name/type (X, Y, Z, M, etc.)
        schema:
          type: string
          title: dimension
      - name: metadata.schemas.tables.indexes.spatialConfig.dimensional.constraints.minValue
        in: query
        description: Minimum value for this dimension
        schema:
          type: number
          title: min_value
          format: double
      - name: metadata.schemas.tables.indexes.spatialConfig.dimensional.constraints.maxValue
        in: query
        description: Maximum value for this dimension
        schema:
          type: number
          title: max_value
          format: double
      - name: metadata.schemas.tables.indexes.spatialConfig.dimensional.constraints.tolerance
        in: query
        description: Tolerance for this dimension
        schema:
          type: number
          title: tolerance
          format: double
      - name: metadata.schemas.tables.indexes.opclassNames
