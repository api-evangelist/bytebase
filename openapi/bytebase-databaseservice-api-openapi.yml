          description: Grid density (LOW, MEDIUM, HIGH)
      title: GridLevel
      additionalProperties: false
      description: GridLevel defines a tessellation grid level with its density.
    bytebase.v1.ColumnMetadata:
      type: object
      properties:
        name:
          type: string
          title: name
          description: The name is the name of a column.
        position:
          type: integer
          title: position
          format: int32
          description: The position is the position in columns.
        hasDefault:
          type: boolean
          title: has_default
        default:
          type: string
          title: default
          description: The default value of column.
        defaultOnNull:
          type: boolean
          title: default_on_null
          description: "Oracle specific metadata.\n The default_on_null is the default on null of a column."
        onUpdate:
          type: string
          title: on_update
          description: "The on_update is the on update action of a column.\n For MySQL like databases, it's only supported for TIMESTAMP columns with\n CURRENT_TIMESTAMP as on update value."
        nullable:
          type: boolean
          title: nullable
          description: The nullable is the nullable of a column.
        type:
          type: string
          title: type
          description: The type is the type of a column.
        characterSet:
          type: string
          title: character_set
          description: The character_set is the character_set of a column.
        collation:
          type: string
          title: collation
          description: The collation is the collation of a column.
        comment:
          type: string
          title: comment
          description: The comment is the comment of a column.
        generation:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.GenerationMetadata'
          title: generation
          description: The generation is the generation of a column.
        isIdentity:
          type: boolean
          title: is_identity
        identityGeneration:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.ColumnMetadata.IdentityGeneration'
          title: identity_generation
          description: The identity_generation is for identity columns, PG only.
        identitySeed:
          type: string
          title: identity_seed
          format: int64
          description: The identity_seed is for identity columns, MSSQL only.
        identityIncrement:
          type: string
          title: identity_increment
          format: int64
          description: The identity_increment is for identity columns, MSSQL only.
        defaultConstraintName:
          type: string
          title: default_constraint_name
          description: "The default_constraint_name is the name of the default constraint, MSSQL only.\n In MSSQL, default values are implemented as named constraints. When modifying or\n dropping a column's default value, you must reference the constraint by name.\n This field stores the actual constraint name from the database.\n\n Example: A column definition like:\n   CREATE TABLE employees (\n     status NVARCHAR(20) DEFAULT 'active'\n   )\n\n Will create a constraint with an auto-generated name like 'DF__employees__statu__3B75D760'\n or a user-defined name if specified:\n   ALTER TABLE employees ADD CONSTRAINT DF_employees_status DEFAULT 'active' FOR status\n\n To modify the default, you must first drop the existing constraint by name:\n   ALTER TABLE employees DROP CONSTRAINT DF__employees__statu__3B75D760\n   ALTER TABLE employees ADD CONSTRAINT DF_employees_status DEFAULT 'inactive' FOR status\n\n This field is populated when syncing from the database. When empty (e.g., when parsing\n from SQL files), the system cannot automatically drop the constraint."
        srid:
          type:
          - integer
          - 'null'
          title: srid
          description: "The spatial reference system identifier of a spatial column, MySQL 8.0 only.\n Unset means the column declares no SRID; presence carries the explicit SRID,\n including the valid SRID 0. SRS_IDs are unsigned 32-bit (custom SRSs may exceed\n int32)."
        isInvisible:
          type: boolean
          title: is_invisible
          description: Whether the column is invisible (hidden from SELECT *), MySQL 8.0.23+ only.
      title: ColumnMetadata
      additionalProperties: false
      description: ColumnMetadata is the metadata for columns.
