  /v1/projects/{project}/instances/{instance}/databases/{database}:diffMetadata:
    post:
      tags:
      - DatabaseService
      summary: DiffMetadata
      description: 'Generates migration statements from the database''s current schema to the

        given target metadata.

        Permissions required: bb.databases.diffMetadata'
      operationId: DatabaseService_DiffMetadata2
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetMetadata:
                  allOf:
                  - $ref: '#/components/schemas/bytebase.v1.DatabaseMetadata'
                  title: target_metadata
                  description: "The metadata of the target schema. The source metadata and the engine are\n read from the database, so only the target travels in the request.\n Must describe the COMPLETE target schema: the diff runs against the full\n stored source, so any object omitted from the target (for example by a\n truncated metadata fetch) is treated as dropped."
              title: DiffMetadataRequest
              required:
              - targetMetadata
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.DiffMetadataResponse'
  /v1/projects/{project}/instances/{instance}/databases/{database}:diffSchema:
    post:
      tags:
      - DatabaseService
      summary: DiffSchema
      description: 'Compares and generates migration statements between two schemas.

        Permissions required: bb.databases.get'
      operationId: DatabaseService_DiffSchema2
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              anyOf:
              - type: object
                properties:
                  changelog:
                    type: string
                    title: changelog
                    description: "The resource name of the changelog\n Format:\n instances/{instance}/databases/{database}/changelogs/{changelog} or projects/{project}/instances/{instance}/databases/{database}/changelogs/{changelog}"
                title: changelog
              - type: object
                properties:
                  schema:
                    type: string
                    title: schema
                    description: The target schema.
                title: schema
              unevaluatedProperties: false
              not:
                allOf:
                - anyOf:
                  - required:
                    - changelog
                  - required:
                    - schema
                - not:
                    oneOf:
                    - required:
                      - changelog
                    - required:
                      - schema
              title: DiffSchemaRequest
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.DiffSchemaResponse'
