  /v1/projects/{project}/instances/{instance}/databases/{database}/changelogs/{changelog}:diffSchema:
    post:
      tags:
      - DatabaseService
      summary: DiffSchema
      description: 'Compares and generates migration statements between two schemas.

        Permissions required: bb.databases.get'
      operationId: DatabaseService_DiffSchema4
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: changelog
        in: path
        description: The changelog id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              anyOf:
              - type: object
                properties:
                  changelog:
                    type: string
                    title: changelog
                    description: "The resource name of the changelog\n Format:\n instances/{instance}/databases/{database}/changelogs/{changelog} or projects/{project}/instances/{instance}/databases/{database}/changelogs/{changelog}"
                title: changelog
              - type: object
                properties:
                  schema:
                    type: string
                    title: schema
                    description: The target schema.
                title: schema
              unevaluatedProperties: false
              not:
                allOf:
                - anyOf:
                  - required:
                    - changelog
                  - required:
                    - schema
                - not:
                    oneOf:
                    - required:
                      - changelog
                    - required:
                      - schema
              title: DiffSchemaRequest
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.DiffSchemaResponse'
  /v1/projects/{project}/instances/{instance}/databases/{database}/metadata:
    get:
      tags:
      - DatabaseService
      summary: GetDatabaseMetadata
      description: 'Retrieves database metadata including tables, columns, and indexes.

        Permissions required: bb.databases.getSchema'
      operationId: DatabaseService_GetDatabaseMetadata2
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: "Filter is used to filter databases returned in the list.\n The syntax and semantics of CEL are documented at https://github.com/google/cel-spec\n\n Supported filter:\n - schema: the schema name, support \"==\" operator.\n - table: the table name, support \"==\" and \".contains()\" operator.\n\n For example:\n schema == \"schema-a\"\n table == \"table-a\"\n table.contains(\"table-a\")\n schema == \"schema-a\" && table.contains(\"sample\")\n The filter is used to search for tables containing \"sample\" in the schema \"schemas/schema-a\".\n The column masking level will only be returned when a table filter is used."
        schema:
          type: string
          title: filter
      - name: limit
        in: query
        description: "Limit the response size of returned table metadata per schema.\n For example, if the database has 3 schemas, and each schema has 100 tables,\n if limit is 20, then only 20 tables will be returned for each schema, total 60 tables.\n Default 0, means no limit."
        schema:
          type: integer
          title: limit
          format: int32
