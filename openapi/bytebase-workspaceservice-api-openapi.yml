openapi: 3.2.0
info:
  title: Bytebase API Reference Workspace Service API
  description: API reference for Bytebase. Every endpoint is served by your own Bytebase instance.
  version: 1.0.0
security: []
tags:
- name: WorkspaceService
  description: WorkspaceService manages workspace-level operations and profile.
paths:
  /v1/workspaces:
    get:
      tags:
      - WorkspaceService
      summary: ListWorkspaces
      description: Lists all workspaces the current user is a member of.
      operationId: WorkspaceService_ListWorkspaces
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListWorkspacesResponse'
  /v1/workspaces/{workspace}:
    get:
      tags:
      - WorkspaceService
      summary: GetWorkspace
      description: 'Gets a workspace by name.

        Supports "workspaces/-" to resolve the current workspace:

        - Authenticated: uses the workspace from JWT context

        - Self-hosted unauthenticated: returns the single workspace

        - SaaS unauthenticated: returns minimal response'
      operationId: WorkspaceService_GetWorkspace
      parameters:
      - name: workspace
        in: path
        description: The workspace id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Workspace'
    delete:
      tags:
      - WorkspaceService
      summary: DeleteWorkspace
      description: 'Deletes a workspace. SaaS only. Cancels any active subscription and

        soft-deletes the workspace so all associated data becomes inaccessible.

        Requires workspace admin permission.'
      operationId: WorkspaceService_DeleteWorkspace
      parameters:
      - name: workspace
        in: path
        description: The workspace id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.LoginResponse'
    patch:
      tags:
      - WorkspaceService
      summary: UpdateWorkspace
      description: Updates a workspace. Currently only title can be updated.
      operationId: WorkspaceService_UpdateWorkspace
      parameters:
      - name: workspace
        in: path
        description: The workspace id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  allOf:
                  - $ref: '#/components/schemas/bytebase.v1.Workspace'
                  title: workspace
                updateMask:
                  allOf:
                  - $ref: '#/components/schemas/google.protobuf.FieldMask'
                  title: update_mask
              title: UpdateWorkspaceRequest
              required:
              - workspace
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Workspace'
  /v1/workspaces/{workspace}:getIamPolicy:
    get:
      tags:
      - WorkspaceService
      summary: GetIamPolicy
      description: 'Retrieves IAM policy for the workspace.

        Permissions required: bb.workspaces.getIamPolicy'
      operationId: WorkspaceService_GetIamPolicy
      parameters:
      - name: workspace
        in: path
        description: The workspace id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.IamPolicy'
  /v1/workspaces/{workspace}:leave:
    post:
      tags:
      - WorkspaceService
      summary: LeaveWorkspace
      description: 'Removes the calling user from a workspace and switches to the next

        available workspace. Available to any workspace member. Fails if the

        caller is the last workspace admin.'
      operationId: WorkspaceService_LeaveWorkspace
      parameters:
      - name: workspace
        in: path
        description: The workspace id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.LoginResponse'
  /v1/workspaces/{workspace}:rotateDirectorySyncToken:
    post:
      tags:
      - WorkspaceService
      summary: RotateDirectorySyncToken
      description: 'Mints a new directory sync (SCIM) token, immediately invalidating the

        previous one. The plaintext token is returned exactly once and cannot be

        retrieved afterwards; only its hash is stored. Callers that lose it must

        rotate again and update their identity provider.

        Permissions required: bb.workspaces.rotateDirectorySyncToken'
      operationId: WorkspaceService_RotateDirectorySyncToken
      parameters:
      - name: workspace
        in: path
        description: The workspace id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.RotateDirectorySyncTokenResponse'
  /v1/workspaces/{workspace}:setIamPolicy:
    post:
      tags:
      - WorkspaceService
      summary: SetIamPolicy
      description: 'Sets IAM policy for the workspace.

        Permissions required: bb.workspaces.setIamPolicy'
      operationId: WorkspaceService_SetIamPolicy
      parameters:
      - name: workspace
        in: path
        description: The workspace id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                policy:
                  allOf:
                  - $ref: '#/components/schemas/bytebase.v1.IamPolicy'
                  title: policy
                etag:
                  type: string
                  title: etag
                  description: "(OPTIONAL) The current etag of the policy. Equivalent to setting `policy.etag`;\n supplying both with different values returns INVALID_ARGUMENT."
              title: SetIamPolicyRequest
              required:
              - policy
              additionalProperties: false
              description: Request message for setting an IAM policy.
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.IamPolicy'
components:
  schemas:
    bytebase.v1.Binding:
      type: object
      properties:
        role:
          type: string
          title: role
          description: "The role that is assigned to the members.\n Format: roles/{role}"
        members:
          type: array
          items:
            type: string
          title: members
          description: "Specifies the principals requesting access for a Bytebase resource.\n For users, the member should be: user:{email}\n For groups, the member should be: group:{email}\n For service accounts, the member should be: serviceAccount:{email}\n For workload identities, the member should be: workloadIdentity:{email}"
        condition:
          allOf:
          - $ref: '#/components/schemas/google.type.Expr'
          title: condition
          description: "The condition that is associated with this binding, only used in the project IAM policy.\n If the condition evaluates to true, then this binding applies to the current request.\n If the condition evaluates to false, then this binding does not apply to the current request. However, a different role binding might grant the same role to one or more of the principals in this binding.\n The syntax and semantics of CEL are documented at https://github.com/google/cel-spec\n\n Support variables:\n resource.database: the canonical database full name in \"instances/{instance}/databases/{database}\" or \"projects/{project}/instances/{instance}/databases/{database}\" format, used by any role with SQL Editor read (e.g. \"roles/sqlEditorUser\", \"roles/sqlEditorReadUser\") or write (bb.sql.ddl / bb.sql.dml) access, support \"==\" operator.\n resource.schema_name: the schema name, used by any role with SQL Editor read or write (bb.sql.ddl / bb.sql.dml) access; for writes it is evaluated per write-target table, support \"==\" operator.\n resource.table_name: the table name, used by any role with SQL Editor read or write (bb.sql.ddl / bb.sql.dml) access; for writes it is evaluated per write-target table, support \"==\" operator.\n resource.environment_id: the environment to allow the DDL/DML operation in the SQL Editor, only works for the role with bb.sql.ddl or bb.sql.dml permissions. Support \"in\" operator.\n request.time: the expiration. Only support \"<\" operation in `request.time < timestamp(\"{ISO datetime string format}\")`.\n\n Known limitations of table/schema-scoped DDL/DML grants:\n - The scope only gates the write target, not the read sources of a write: e.g. `INSERT INTO granted_table SELECT * FROM other_table` may read `other_table` without a grant on it, so a table-scoped write grant is not an exfiltration boundary.\n - It must be paired with a database/project-level read grant: a table-scoped grant alone does not satisfy the SQL Editor query method permission (bb.databases.get).\n - A resource.schema_name-scoped grant only authorizes a write whose schema is unambiguous — qualify the table (schema.table) or select the schema for the SQL Editor session. An unqualified write whose effective schema cannot be determined ahead of execution is denied (qualify it, or use a table-only grant).\n - Multi-statement batches are authorized at the database level: an earlier statement can rebind the session's default schema or database mid-batch, so per-table/schema scoping is dropped and a table/schema-scoped grant requires a database-level grant. The database-level check is still per target database — a qualified cross-database write is gated by a grant on its own database, not the request database — but an unqualified write whose session default is rebound mid-batch is evaluated against the database it literally names, so qualify cross-database writes or run them as single statements.\n - A write target in a different project than the SQL-Editor session's database is denied: the per-target check evaluates the session project's IAM policy, so a cross-project write is failed closed (to write it, open the SQL Editor on a database in the target project).\n - Enforcement is on the statement's literal write target; writes routed elsewhere by a view/synonym, or into a temporary schema (e.g. pg_temp), are evaluated against what the statement names, not the ultimate base object.\n - Write-target gating uses an ALLOWLIST of statement types the resolver models. It does NOT cover every syntactically-identifiable cross-database write; statement types off the allowlist are authorized against the request database. The allowlist is:\n     - Modeled table/data writes (per-table/schema-scopable): INSERT/UPDATE/DELETE/TRUNCATE/MERGE, LOAD DATA, IMPORT INTO, CREATE TABLE AS / SELECT INTO, and table-level CREATE/DROP/ALTER/RENAME/index.\n     - Modeled non-table object DDL (gated at the DATABASE level by the object's own explicit database/schema qualifier; an unqualified name keeps the request-database check): CREATE/ALTER/DROP of view, procedure/function/routine, trigger, sequence, synonym, type, and (Oracle) package and cluster; plus Oracle ALTER/DROP MATERIALIZED VIEW (Oracle CREATE MATERIALIZED VIEW is not modeled — see below).\n   NOT modeled (these fall back to the request-database check, so a qualified cross-database one is authorized against the request database): MySQL CREATE TRIGGER and CREATE/ALTER/DROP EVENT (bare-string AST names); MSSQL ALTER of view/procedure/function/trigger (no ALTER node in the grammar); Oracle CREATE MATERIALIZED VIEW and the niche object DDL — dimension, attribute dimension, hierarchy, analytic view, JSON duality view, materialized zonemap, operator, in-memory join group, property graph, vector index, index type, domain; COPY ... FROM; and engine-specific bulk-load / deprecated text writes. A structural \"write-target object database\" extraction layer to remove this allowlist dependence is tracked as a follow-up.\n     - Out of scope (read sources / indirect effects): the tables a write READS (INSERT … SELECT, MERGE … USING, CREATE TABLE AS … SELECT) and objects reached indirectly via views/synonyms/function bodies/triggers are NOT gated.\n   Invariant: for a statement ON the modeled allowlist that explicitly names a different database as its write target, the ACL uses that target database, not the request database. Statement types OFF the allowlist are authorized against the request database.\n\n For example:\n resource.database == \"instances/local-pg/databases/postgres\" && resource.schema_name in [\"public\",\"another_schema\"]\n resource.database == \"instances/local-pg/databases/bytebase\" && resource.schema_name == \"public\" && resource.table_name in [\"audit_log\"]\n resource.database == \"instances/local-pg/databases/postgres\" && resource.environment_id in [\"test\"]\n request.time < timestamp(\"2025-04-26T11:24:48.655Z\")"
        parsedExpr:
          allOf:
          - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: parsed_expr
          description: The parsed expression of the condition.
          readOnly: true
      title: Binding
      additionalProperties: false
      description: Binding associates members with a role and optional conditions.
    google.api.expr.v1alpha1.Expr.Comprehension:
      type: object
      properties:
        iterVar:
          type: string
          title: iter_var
          description: "The name of the first iteration variable.\n When the iter_range is a list, this variable is the list element.\n When the iter_range is a map, this variable is the map entry key."
        iterVar2:
          type: string
          title: iter_var2
          description: "The name of the second iteration variable, empty if not set.\n When the iter_range is a list, this variable is the integer index.\n When the iter_range is a map, this variable is the map entry value.\n This field is only set for comprehension v2 macros."
        iterRange:
          allOf:
          - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: iter_range
          description: The range over which the comprehension iterates.
        accuVar:
          type: string
          title: accu_var
          description: The name of the variable used for accumulation of the result.
        accuInit:
          allOf:
          - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: accu_init
          description: The initial value of the accumulator.
        loopCondition:
          allOf:
          - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: loop_condition
          description: "An expression which can contain iter_var, iter_var2, and accu_var.\n\n Returns false when the result has been computed and may be used as\n a hint to short-circuit the remainder of the comprehension."
        loopStep:
          allOf:
          - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: loop_step
          description: "An expression which can contain iter_var, iter_var2, and accu_var.\n\n Computes the next value of accu_var."
        result:
          allOf:
          - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: result
          description: "An expression which can contain accu_var.\n\n Computes the result."
      title: Comprehension
      additionalProperties: false
      description: "A comprehension expression applied to a list or map.\n\n Comprehensions are not part of the core syntax, but enabled with macros.\n A macro matches a specific call signature within a parsed AST and replaces\n the call with an alternate AST block. Macro expansion happens at parse\n time.\n\n The following macros are supported within CEL:\n\n Aggregate type macros may be applied to all elements in a list or all keys\n in a map:\n\n *  `all`, `exists`, `exists_one` -  test a predicate expression against\n    the inputs and return `true` if the predicate is satisfied for all,\n    any, or only one value `list.all(x, x < 10)`.\n *  `filter` - test a predicate expression against the inputs and return\n    the subset of elements which satisfy the predicate:\n    `payments.filter(p, p > 1000)`.\n *  `map` - apply an expression to all elements in the input and return the\n    output aggregate type: `[1, 2, 3].map(i, i * i)`.\n\n The `has(m.x)` macro tests whether the property `x` is present in struct\n `m`. The semantics of this macro depend on the type of `m`. For proto2\n messages `has(m.x)` is defined as 'defined, but not set`. For proto3, the\n macro tests whether the property is set to its default. For map and struct\n types, the macro tests whether the property `x` is defined on `m`.\n\n Comprehensions for the standard environment macros evaluation can be best\n visualized as the following pseudocode:\n\n ```\n let `accu_var` = `accu_init`\n for (let `iter_var` in `iter_range`) {\n   if (!`loop_condition`) {\n     break\n   }\n   `accu_var` = `loop_step`\n }\n return `result`\n ```\n\n Comprehensions for the optional V2 macros which support map-to-map\n translation differ slightly from the standard environment macros in that\n they expose both the key or index in addition to the value for each list\n or map entry:\n\n ```\n let `accu_var` = `accu_init`\n for (let `iter_var`, `iter_var2` in `iter_range`) {\n   if (!`loop_condition`) {\n     break\n   }\n   `accu_var` = `loop_step`\n }\n return `result`\n ```"
    bytebase.v1.State:
      type: string
      title: State
      enum:
      - STATE_UNSPECIFIED
      - ACTIVE
      - DELETED
      description: Resource lifecycle state.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
      - NULL_VALUE
      description: "`NullValue` is a singleton enumeration to represent the null value for the\n `Value` type union.\n\n The JSON representation for `NullValue` is JSON `null`."
    google.type.Expr:
      type: object
      properties:
        expression:
          type: string
          title: expression
          description: "Textual representation of an expression in Common Expression Language\n syntax."
        title:
          type: string
          title: title
          description: "Optional. Title for the expression, i.e. a short string describing\n its purpose. This can be used e.g. in UIs which allow to enter the\n expression."
        description:
          type: string
          title: description
          description: "Optional. Description of the expression. This is a longer text which\n describes the expression, e.g. when hovered over it in a UI."
        location:
          type: string
          title: location
          description: "Optional. String indicating the location of the expression for error\n reporting, e.g. a file name and a position in the file."
      title: Expr
      additionalProperties: false
      description: "Represents a textual expression in the Common Expression Language (CEL)\n syntax. CEL is a C-like expression language. The syntax and semantics of CEL\n are documented at https://github.com/google/cel-spec.\n\n Example (Comparison):\n\n     title: \"Summary size limit\"\n     description: \"Determines if a summary is less than 100 chars\"\n     expression: \"document.summary.size() < 100\"\n\n Example (Equality):\n\n     title: \"Requestor is owner\"\n     description: \"Determines if requestor is the document owner\"\n     expression: \"document.owner == request.auth.claims.email\"\n\n Example (Logic):\n\n     title: \"Public documents\"\n     description: \"Determine whether the document should be publicly visible\"\n     expression: \"document.type != 'private' && document.type != 'internal'\"\n\n Example (Data Manipulation):\n\n     title: \"Notification string\"\n     description: \"Create a notification string with a timestamp.\"\n     expression: \"'New message received at ' + string(document.create_time)\"\n\n The exact variables and functions that may be referenced within an expression\n are determined by the service that evaluates it. See the service\n documentation for additional information."
    google.protobuf.FieldMask:
      type: string
      description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
    bytebase.v1.Workspace:
      type: object
      properties:
        name:
          type: string
          title: name
          description: 'Format: workspaces/{workspace}'
        title:
          type: string
          title: title
        logo:
          type: string
          title: logo
          description: The branding logo.
      title: Workspace
      additionalProperties: false
    google.api.expr.v1alpha1.Expr.Select:
      type: object
      properties:
        operand:
          allOf:
          - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: operand
          description: "Required. The target of the selection expression.\n\n For example, in the select expression `request.auth`, the `request`\n portion of the expression is the `operand`."
        field:
          type: string
          title: field
          description: "Required. The name of the field to select.\n\n For example, in the select expression `request.auth`, the `auth` portion\n of the expression would be the `field`."
        testOnly:
          type: boolean
          title: test_only
          description: "Whether the select is to be interpreted as a field presence test.\n\n This results from the macro `has(request.auth)`."
      title: Select
      additionalProperties: false
      description: A field selection expression. e.g. `request.auth`.
    bytebase.v1.IamPolicy:
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Binding'
          title: bindings
          description: "Collection of binding.\n A binding binds one or more project members to a single project role."
        etag:
          type: string
          title: etag
          description: "The current etag of the policy, returned by GetIamPolicy and SetIamPolicy.\n Sending it back on SetIamPolicy makes the write conditional: if the policy\n changed since the read, the call returns ABORTED. Omitting it applies the\n write unconditionally, overwriting any concurrent change (AIP-154)."
      title: IamPolicy
      additionalProperties: false
      description: IAM policy that binds members to roles.
    bytebase.v1.LoginResponse:
      type: object
      properties:
        token:
          type: string
          title: token
          description: "Access token for authenticated requests.\n Only returned when web=false. For web=true, the token is set as an HTTP-only cookie."
        mfaTempToken:
          type:
          - string
          - 'null'
          title: mfa_temp_token
          description: Temporary token for MFA verification.
        requireResetPassword:
          type: boolean
          title: require_reset_password
          description: Whether user must reset password before continuing.
        user:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.User'
          title: user
          description: The user from the successful login.
      title: LoginResponse
      additionalProperties: false
    bytebase.v1.ListWorkspacesResponse:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Workspace'
          title: workspaces
      title: ListWorkspacesResponse
      additionalProperties: false
    google.protobuf.Timestamp:
      type: string
      examples:
      - '2023-01-15T01:30:15.01Z'
      - '2024-12-25T12:00:00Z'
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    google.api.expr.v1alpha1.Expr.CreateStruct.Entry:
      type: object
      anyOf:
      - type: object
        properties:
          fieldKey:
            type: string
            title: field_key
            description: The field key for a message creator statement.
        title: field_key
      - type: object
        properties:
          mapKey:
            allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
            title: map_key
            description: The key expression for a map creation statement.
        title: map_key
      unevaluatedProperties: false
      not:
        allOf:
        - anyOf:
          - required:
            - fieldKey
          - required:
            - mapKey
        - not:
            oneOf:
            - required:
              - fieldKey
            - required:
              - mapKey
      properties:
        id:
          type: string
          title: id
          format: int64
          description: "Required. An id assigned to this node by the parser which is unique\n in a given expression tree. This is used to associate type\n information and other attributes to the node."
        value:
          allOf:
          - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: value
          description: "Required. The value assigned to the key.\n\n If the optional_entry field is true, the expression must resolve to an\n optional-typed value. If the optional value is present, the key will be\n set; however, if the optional value is absent, the key will be unset."
        optionalEntry:
          type: boolean
          title: optional_entry
          description: Whether the key-value pair is optional.
      title: Entry
      description: Represents an entry.
    bytebase.v1.User.Profile:
      type: object
      properties:
        lastLoginTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_login_time
          description: The last time the user successfully logged in.
        lastChangePasswordTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_change_password_time
          description: The last time the user changed their password.
        source:
          type: string
          title: source
          description: source means where the user comes from. For now we support Entra ID SCIM sync, so the source could be Entra ID.
      title: Profile
      additionalProperties: false
    google.api.expr.v1alpha1.Expr.Ident:
      type: object
      properties:
        name:
          type: string
          title: name
          description: "Required. Holds a single, unqualified identifier, possibly preceded by a\n '.'.\n\n Qualified names are represented by the\n [Expr.Select][google.api.expr.v1alpha1.Expr.Select] expression."
      title: Ident
      additionalProperties: false
      description: An identifier expression. e.g. `request`.
    google.api.expr.v1alpha1.Constant:
      type: object
      anyOf:
      - type: object
        properties:
          boolValue:
            type: boolean
            title: bool_value
            description: boolean value.
        title: bool_value
      - type: object
        properties:
          bytesValue:
            type: string
            title: bytes_value
            format: byte
            description: bytes value.
        title: bytes_value
      - type: object
        properties:
          doubleValue:
            type: number
            title: double_value
            format: double
            description: double value.
        title: double_value
      - type: object
        properties:
          durationValue:
            allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
            title: duration_value
            description: "protobuf.Duration value.\n\n Deprecated: duration is no longer considered a builtin cel type."
            deprecated: true
        title: duration_value
      - type: object
        properties:
          int64Value:
            type: string
            title: int64_value
            format: int64
            description: int64 value.
        title: int64_value
      - type: object
        properties:
          nullValue:
            allOf:
            - $ref: '#/components/schemas/google.protobuf.NullValue'
            title: null_value
            description: null value.
        title: null_value
      - type: object
        properties:
          stringValue:
            type: string
            title: string_value
            description: string value.
        title: string_value
      - type: object
        properties:
          timestampValue:
            allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
            title: timestamp_value
            description: "protobuf.Timestamp value.\n\n Deprecated: timestamp is no longer considered a builtin cel type."
            deprecated: true
        title: timestamp_value
      - type: object
        properties:
          uint64Value:
            type: string
            title: uint64_value
            format: int64
            description: uint64 value.
        title: uint64_value
      unevaluatedProperties: false
      not:
        allOf:
