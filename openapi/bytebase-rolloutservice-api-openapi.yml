openapi: 3.2.0
info:
  title: Bytebase API Reference Rollout Service API
  description: API reference for Bytebase. Every endpoint is served by your own Bytebase instance.
  version: 1.0.0
security: []
tags:
- name: RolloutService
  description: RolloutService manages the execution of deployment plans.
paths:
  /v1/projects/{project}/plans/{plan}/rollout:
    get:
      tags:
      - RolloutService
      summary: GetRollout
      description: 'Retrieves a rollout by its plan name.

        Permissions required: bb.rollouts.get'
      operationId: RolloutService_GetRollout
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Rollout'
    post:
      tags:
      - RolloutService
      summary: CreateRollout
      description: 'Creates a new rollout for a plan.

        Permissions required: bb.rollouts.create'
      operationId: RolloutService_CreateRollout
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type:
                  - string
                  - 'null'
                  title: target
                  description: "Create the rollout only for the specified target.\n Format: environments/{environment}\n If unspecified, all stages are created.\n If set to \"\", no stages are created."
              title: CreateRolloutRequest
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Rollout'
  /v1/projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns:
    get:
      tags:
      - RolloutService
      summary: ListTaskRuns
      description: 'Lists task run executions for a task.

        Permissions required: bb.taskRuns.list'
      operationId: RolloutService_ListTaskRuns
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      - name: stage
        in: path
        description: The stage id.
        required: true
        schema:
          type: string
      - name: task
        in: path
        description: The task id.
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: "The maximum number of task runs to return. The service may return fewer\n than this value.\n If unspecified, at most 1000 task runs will be returned.\n The maximum value is 1000; values above 1000 will be coerced to 1000."
        schema:
          type: integer
          title: page_size
          format: int32
      - name: pageToken
        in: query
        description: "A page token, received from a previous `ListTaskRuns` call.\n Provide this to retrieve the subsequent page.\n\n When paginating, all other parameters provided to `ListTaskRuns` must match\n the call that provided the page token."
        schema:
          type: string
          title: page_token
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListTaskRunsResponse'
  /v1/projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns/{taskRun}:
    get:
      tags:
      - RolloutService
      summary: GetTaskRun
      description: 'Retrieves a task run by name.

        Permissions required: bb.taskRuns.list'
      operationId: RolloutService_GetTaskRun
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      - name: stage
        in: path
        description: The stage id.
        required: true
        schema:
          type: string
      - name: task
        in: path
        description: The task id.
        required: true
        schema:
          type: string
      - name: taskRun
        in: path
        description: The taskRun id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.TaskRun'
  /v1/projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns/{taskRun}/log:
    get:
      tags:
      - RolloutService
      summary: GetTaskRunLog
      description: 'Retrieves execution logs for a task run.

        Permissions required: bb.taskRuns.list'
      operationId: RolloutService_GetTaskRunLog
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      - name: stage
        in: path
        description: The stage id.
        required: true
        schema:
          type: string
      - name: task
        in: path
        description: The task id.
        required: true
        schema:
          type: string
      - name: taskRun
        in: path
        description: The taskRun id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.TaskRunLog'
  /v1/projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns/{taskRun}/session:
    get:
      tags:
      - RolloutService
      summary: GetTaskRunSession
      description: 'Retrieves database session information for a running task.

        Permissions required: bb.taskRuns.list'
      operationId: RolloutService_GetTaskRunSession
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      - name: stage
        in: path
        description: The stage id.
        required: true
        schema:
          type: string
      - name: task
        in: path
        description: The task id.
        required: true
        schema:
          type: string
      - name: taskRun
        in: path
        description: The taskRun id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.TaskRunSession'
  /v1/projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns/{taskRun}:previewRollback:
    post:
      tags:
      - RolloutService
      summary: PreviewTaskRunRollback
      description: 'Generates rollback SQL for a completed task run.

        Permissions required: bb.taskRuns.list'
      operationId: RolloutService_PreviewTaskRunRollback
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      - name: stage
        in: path
        description: The stage id.
        required: true
        schema:
          type: string
      - name: task
        in: path
        description: The task id.
        required: true
        schema:
          type: string
      - name: taskRun
        in: path
        description: The taskRun id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.PreviewTaskRunRollbackResponse'
  /v1/projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns:batchCancel:
    post:
      tags:
      - RolloutService
      summary: BatchCancelTaskRuns
      description: 'Cancels multiple task runs.

        PENDING and AVAILABLE task runs are moved to CANCELED synchronously. RUNNING task runs receive

        a best-effort cancellation request and may continue running if the request is missed or the

        executor does not stop. The response does not report which task runs were actually canceled.

        Permissions required: bb.taskRuns.create (or user with rollout policy role for the environment)'
      operationId: RolloutService_BatchCancelTaskRuns
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      - name: stage
        in: path
        description: The stage id.
        required: true
        schema:
          type: string
      - name: task
        in: path
        description: The task id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                taskRuns:
                  type: array
                  items:
                    type: string
                  title: task_runs
                  description: "The taskRuns to cancel.\n Format: projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns/{taskRun}"
              title: BatchCancelTaskRunsRequest
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.BatchCancelTaskRunsResponse'
  /v1/projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks:batchRun:
    post:
      tags:
      - RolloutService
      summary: BatchRunTasks
      description: 'Executes multiple tasks in a rollout stage.

        Permissions required: bb.taskRuns.create (or user with rollout policy role for the environment)'
      operationId: RolloutService_BatchRunTasks
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      - name: stage
        in: path
        description: The stage id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tasks:
                  type: array
                  items:
                    type: string
                  title: tasks
                  description: "The tasks to run.\n Format: projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}"
                runTime:
                  oneOf:
                  - $ref: '#/components/schemas/google.protobuf.Timestamp'
                  - type: 'null'
                  title: run_time
                  description: The task run should run after run_time.
                skipPriorBackup:
                  type: boolean
                  title: skip_prior_backup
                  description: If true, skip prior backup for this run even if the task has prior backup enabled.
              title: BatchRunTasksRequest
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.BatchRunTasksResponse'
  /v1/projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks:batchSkip:
    post:
      tags:
      - RolloutService
      summary: BatchSkipTasks
      description: 'Skips multiple tasks in a rollout stage.

        Permissions required: bb.taskRuns.create (or user with rollout policy role for the environment)'
      operationId: RolloutService_BatchSkipTasks
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: plan
        in: path
        description: The plan id.
        required: true
        schema:
          type: string
      - name: stage
        in: path
        description: The stage id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tasks:
                  type: array
                  items:
                    type: string
                  title: tasks
                  description: "The tasks to skip.\n Format: projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}"
                reason:
                  type: string
                  title: reason
                  maxLength: 1000
                  description: The reason for skipping the tasks.
              title: BatchSkipTasksRequest
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.BatchSkipTasksResponse'
  /v1/projects/{project}/rollouts:
    get:
      tags:
      - RolloutService
      summary: ListRollouts
      description: 'Lists rollouts in a project.

        Permissions required: bb.rollouts.list'
      operationId: RolloutService_ListRollouts
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: "The maximum number of rollouts to return. The service may return fewer than\n this value.\n If unspecified, at most 10 rollouts will be returned.\n The maximum value is 1000; values above 1000 will be coerced to 1000."
        schema:
          type: integer
          title: page_size
          format: int32
      - name: pageToken
        in: query
        description: "A page token, received from a previous `ListRollouts` call.\n Provide this to retrieve the subsequent page.\n\n When paginating, all other parameters provided to `ListRollouts` must match\n the call that provided the page token."
        schema:
          type: string
          title: page_token
      - name: filter
        in: query
        description: "Filter is used to filter rollouts returned in the list.\n The syntax and semantics of CEL are documented at https://github.com/google/cel-spec\n\n Supported filters:\n - update_time: rollout update time in \"2006-01-02T15:04:05Z07:00\" format, support \">=\" or \"<=\" operator.\n - task_type: the task type, support \"in\" operator, check the Task.Type enum for the values.\n\n For example:\n update_time >= \"2025-01-02T15:04:05Z07:00\"\n task_type in [\"DATABASE_MIGRATE\", \"DATABASE_CREATE\"]"
        schema:
          type: string
          title: filter
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListRolloutsResponse'
components:
  schemas:
    bytebase.v1.TaskRun.SchedulerInfo:
      type: object
      properties:
        reportTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: report_time
          description: The time when the scheduling info was reported.
        waitingCause:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRun.SchedulerInfo.WaitingCause'
          title: waiting_cause
          description: The cause for the task run waiting.
      title: SchedulerInfo
      additionalProperties: false
      description: Information about task run scheduling.
    bytebase.v1.TaskRun.Status:
      type: string
      title: Status
      enum:
      - STATUS_UNSPECIFIED
      - PENDING
      - RUNNING
      - DONE
      - FAILED
      - CANCELED
      - AVAILABLE
    bytebase.v1.Task:
      type: object
      anyOf:
      - type: object
        properties:
          databaseCreate:
            allOf:
            - $ref: '#/components/schemas/bytebase.v1.Task.DatabaseCreate'
            title: database_create
        title: database_create
      - type: object
        properties:
          databaseUpdate:
            allOf:
            - $ref: '#/components/schemas/bytebase.v1.Task.DatabaseUpdate'
            title: database_update
        title: database_update
      unevaluatedProperties: false
      not:
        allOf:
        - anyOf:
          - required:
            - databaseCreate
          - required:
            - databaseUpdate
        - not:
            oneOf:
            - required:
              - databaseCreate
            - required:
              - databaseUpdate
      properties:
        name:
          type: string
          title: name
          description: 'Format: projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}'
        specId:
          type: string
          title: spec_id
          description: A UUID4 string that uniquely identifies the Spec.
        status:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.Task.Status'
          title: status
          description: Status is the status of the task.
        skippedReason:
          type: string
          title: skipped_reason
          description: The reason why the task was skipped.
        type:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.Task.Type'
          title: type
        target:
          type: string
          title: target
          description: "Format: instances/{instance} or projects/{project}/instances/{instance} if the task is DatabaseCreate.\n Format: instances/{instance}/databases/{database} or projects/{project}/instances/{instance}/databases/{database}"
        updateTime:
          oneOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          - type: 'null'
          title: update_time
          description: "The update_time is the update time of latest task run.\n If there are no task runs, it will be empty."
          readOnly: true
        runTime:
          oneOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          - type: 'null'
          title: run_time
          description: "The run_time is the scheduled run time of latest task run.\n If there are no task runs or the task run is not scheduled, it will be empty."
          readOnly: true
      title: Task
    bytebase.v1.TaskRunSession.Postgres:
      type: object
      properties:
        session:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunSession.Postgres.Session'
          title: session
          description: '`session` is the session of the task run executing commands.'
        blockingSessions:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.TaskRunSession.Postgres.Session'
          title: blocking_sessions
          description: '`blocking_sessions` block `session`.'
        blockedSessions:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.TaskRunSession.Postgres.Session'
          title: blocked_sessions
          description: '`blocked_sessions` are blocked by `session`.'
      title: Postgres
      additionalProperties: false
      description: PostgreSQL session information.
    bytebase.v1.TaskRunLogEntry.ReleaseFileExecute:
      type: object
      properties:
        version:
          type: string
          title: version
          description: The version of the file being executed (e.g., "0001").
        filePath:
          type: string
          title: file_path
          description: The file path within the release (e.g., "2.2/V0001_create_table.sql").
      title: ReleaseFileExecute
      additionalProperties: false
      description: Release file execution details.
    bytebase.v1.TaskRunLogEntry:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.Type'
          title: type
          description: The type of this log entry.
        logTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: log_time
          description: The time when the log was recorded.
        replicaId:
          type: string
          title: replica_id
          description: The replica ID for this log entry.
        schemaDump:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.SchemaDump'
          title: schema_dump
          description: Schema dump details (if type is SCHEMA_DUMP).
        commandExecute:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.CommandExecute'
          title: command_execute
          description: Command execution details (if type is COMMAND_EXECUTE).
        databaseSync:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.DatabaseSync'
          title: database_sync
          description: Database sync details (if type is DATABASE_SYNC).
        transactionControl:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.TransactionControl'
          title: transaction_control
          description: Transaction control details (if type is TRANSACTION_CONTROL).
        priorBackup:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.PriorBackup'
          title: prior_backup
          description: Prior backup details (if type is PRIOR_BACKUP).
        retryInfo:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.RetryInfo'
          title: retry_info
          description: Retry information details (if type is RETRY_INFO).
        computeDiff:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.ComputeDiff'
          title: compute_diff
          description: Compute diff details (if type is COMPUTE_DIFF).
        releaseFileExecute:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.ReleaseFileExecute'
          title: release_file_execute
          description: Release file execution details (if type is RELEASE_FILE_EXECUTE).
        ghostMigration:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.GhostMigration'
          title: ghost_migration
          description: gh-ost migration details (if type is GHOST_MIGRATION).
      title: TaskRunLogEntry
      additionalProperties: false
    bytebase.v1.TaskRunLogEntry.CommandExecute:
      type: object
      properties:
        logTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: log_time
          description: When the command was logged.
        range:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.Range'
          title: range
          description: "The byte offset range of the executed command in the sheet.\n Uses byte offsets (not character indices) for efficient slicing of sheet content bytes.\n Example: For \"SELECT 你好;\" in a UTF-8 sheet, range [0, 13) represents all 13 bytes."
        statement:
          type: string
          title: statement
          description: The executed statement.
        response:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.CommandExecute.CommandResponse'
          title: response
          description: The response from executing the command.
      title: CommandExecute
      additionalProperties: false
      description: Command execution details.
    bytebase.v1.TaskRunLog:
      type: object
      properties:
        name:
          type: string
          title: name
          description: 'Format: projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns/{taskRun}/log'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry'
          title: entries
          description: The log entries for this task run.
      title: TaskRunLog
      additionalProperties: false
    bytebase.v1.TaskRunLogEntry.TransactionControl:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.TransactionControl.Type'
          title: type
          description: The type of transaction control.
        error:
          type: string
          title: error
          description: Error message if the operation failed.
      title: TransactionControl
      additionalProperties: false
      description: Transaction control operation details.
    bytebase.v1.TaskRunLogEntry.TransactionControl.Type:
      type: string
      title: Type
      enum:
      - TYPE_UNSPECIFIED
      - BEGIN
      - COMMIT
      - ROLLBACK
      description: Transaction control type.
    bytebase.v1.TaskRunLogEntry.SchemaDump:
      type: object
      properties:
        startTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_time
          description: When the schema dump started.
        endTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_time
          description: When the schema dump ended.
        error:
          type: string
          title: error
          description: Error message if the schema dump failed.
      title: SchemaDump
      additionalProperties: false
      description: Schema dump operation details.
    bytebase.v1.TaskRunLogEntry.CommandExecute.CommandResponse:
      type: object
      properties:
        logTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: log_time
          description: When the response was logged.
        error:
          type: string
          title: error
          description: Error message if command execution failed.
        affectedRows:
          type: string
          title: affected_rows
          format: int64
          description: Total affected rows.
        allAffectedRows:
          type: array
          items:
            type: string
            format: int64
          title: all_affected_rows
          description: "`all_affected_rows` is the affected rows of each command.\n `all_affected_rows` may be unavailable if the database driver doesn't support it. Caller should fallback to `affected_rows` in that case."
      title: CommandResponse
      additionalProperties: false
      description: Command execution response.
    bytebase.v1.Task.Status:
      type: string
      title: Status
      enum:
      - STATUS_UNSPECIFIED
      - NOT_STARTED
      - PENDING
      - RUNNING
      - DONE
      - FAILED
      - CANCELED
      - SKIPPED
    bytebase.v1.TaskRunLogEntry.PriorBackup:
      type: object
      properties:
        startTime:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_time
          description: When the backup started.
        endTime:
          allOf:
