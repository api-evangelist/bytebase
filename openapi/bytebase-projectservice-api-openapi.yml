          format: int32
          description: The maximum number of retries for lock timeout errors.
      title: ExecutionRetryPolicy
      additionalProperties: false
      description: Execution retry policy configuration.
    google.api.expr.v1alpha1.Expr:
      type: object
      anyOf:
      - type: object
        properties:
          callExpr:
            allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.Call'
            title: call_expr
            description: A call expression, including calls to predefined functions and operators.
        title: call_expr
      - type: object
        properties:
          comprehensionExpr:
            allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.Comprehension'
            title: comprehension_expr
            description: A comprehension expression.
        title: comprehension_expr
      - type: object
        properties:
          constExpr:
            allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Constant'
            title: const_expr
            description: A literal expression.
        title: const_expr
      - type: object
        properties:
          identExpr:
            allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.Ident'
            title: ident_expr
            description: An identifier expression.
        title: ident_expr
      - type: object
        properties:
          listExpr:
            allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.CreateList'
            title: list_expr
            description: A list creation expression.
        title: list_expr
      - type: object
        properties:
          selectExpr:
            allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.Select'
            title: select_expr
            description: A field selection expression, e.g. `request.auth`.
        title: select_expr
      - type: object
        properties:
          structExpr:
            allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.CreateStruct'
            title: struct_expr
            description: A map or message creation expression.
        title: struct_expr
      unevaluatedProperties: false
      not:
        allOf:
        - anyOf:
          - required:
            - callExpr
          - required:
            - comprehensionExpr
          - required:
            - constExpr
          - required:
            - identExpr
          - required:
            - listExpr
          - required:
            - selectExpr
          - required:
            - structExpr
        - not:
            oneOf:
            - required:
              - callExpr
            - required:
              - comprehensionExpr
            - required:
              - constExpr
            - required:
              - identExpr
            - required:
              - listExpr
            - required:
              - selectExpr
            - required:
              - structExpr
      properties:
        id:
          type: string
          title: id
          format: int64
          description: "Required. An id assigned to this node by the parser which is unique in a\n given expression tree. This is used to associate type information and other\n attributes to a node in the parse tree."
      title: Expr
      description: "An abstract representation of a common expression.\n\n Expressions are abstractly represented as a collection of identifiers,\n select statements, function calls, literals, and comprehensions. All\n operators with the exception of the '.' operator are modelled as function\n calls. This makes it easy to represent new operators into the existing AST.\n\n All references within expressions must resolve to a\n [Decl][google.api.expr.v1alpha1.Decl] provided at type-check for an\n expression to be valid. A reference may either be a bare identifier `name` or\n a qualified identifier `google.api.name`. References may either refer to a\n value or a function declaration.\n\n For example, the expression `google.api.name.startsWith('expr')` references\n the declaration `google.api.name` within a\n [Expr.Select][google.api.expr.v1alpha1.Expr.Select] expression, and the\n function declaration `startsWith`."
    google.protobuf.Duration:
      type: string
      format: duration
      description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
    bytebase.v1.Project:
      type: object
      properties:
        name:
          type: string
          title: name
          description: "The name of the project.\n Format: projects/{project}"
        state:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.State'
          title: state
          description: The lifecycle state of the project.
        title:
          type: string
          title: title
          maxLength: 200
          description: The title or name of a project. It's not unique within the workspace.
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Webhook'
          title: webhooks
          description: The list of webhooks configured for the project.
        dataClassificationConfigId:
          type: string
          title: data_classification_config_id
          description: The data classification configuration ID for the project.
        issueLabels:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Label'
          title: issue_labels
          description: Labels available for tagging issues in this project.
        forceIssueLabels:
          type: boolean
          title: force_issue_labels
          description: Force issue labels to be used when creating an issue.
        enforceIssueTitle:
          type: boolean
          title: enforce_issue_title
          description: Enforce issue title to be created by user instead of generated by Bytebase.
        postgresDatabaseTenantMode:
          type: boolean
          title: postgres_database_tenant_mode
          description: "Whether to enable database tenant mode for PostgreSQL.\n If enabled, issues will include \"set role <db_owner>\" statement."
        allowSelfApproval:
          type: boolean
          title: allow_self_approval
          description: Whether to allow issue creators to self-approve their own issues.
