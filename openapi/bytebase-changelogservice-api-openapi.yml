openapi: 3.2.0
info:
  title: Bytebase API Reference Changelog Service API
  description: API reference for Bytebase. Every endpoint is served by your own Bytebase instance.
  version: 1.0.0
security: []
tags:
- name: ChangelogService
  description: ChangelogService manages database migration history.
paths:
  /v1/instances/{instance}/databases/{database}/changelogs:
    get:
      tags:
      - ChangelogService
      summary: ListChangelogs
      description: 'Lists migration history for a database.

        Permissions required: bb.changelogs.list'
      operationId: ChangelogService_ListChangelogs
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: "The maximum number of changelogs to return. The service may return fewer\n than this value. If unspecified, at most 10 changelogs will be returned.\n The maximum value is 1000; values above 1000 will be coerced to 1000."
        schema:
          type: integer
          title: page_size
          format: int32
      - name: pageToken
        in: query
        description: "A page token, received from the previous call.\n Provide this to retrieve the subsequent page.\n\n When paginating, all other parameters provided must match\n the call that provided the page token."
        schema:
          type: string
          title: page_token
      - name: view
        in: query
        description: The view query parameter.
        schema:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.ChangelogView'
          title: view
      - name: filter
        in: query
        description: "Filter is used to filter changelogs returned in the list.\n The syntax and semantics of CEL are documented at https://github.com/google/cel-spec\n\n Supported filter:\n - status: the changelog status, support \"==\" operation. check Changelog.Status for available values.\n - has_schema_snapshot: filters to changelogs with a schema snapshot; only \"has_schema_snapshot == true\" is supported.\n - create_time: the changelog create time in RFC 3339 format, supports \">=\", \"<=\", or \"<\" operator.\n\n Example:\n status == \"DONE\"\n status == \"FAILED\"\n has_schema_snapshot == true && create_time < \"2024-01-02T00:00:00Z\""
        schema:
          type: string
          title: filter
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListChangelogsResponse'
  /v1/instances/{instance}/databases/{database}/changelogs/{changelog}:
    get:
      tags:
      - ChangelogService
      summary: GetChangelog
      description: 'Retrieves a specific changelog entry.

        Permissions required: bb.changelogs.get'
      operationId: ChangelogService_GetChangelog
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: database
        in: path
        description: The database id.
        required: true
        schema:
          type: string
      - name: changelog
        in: path
        description: The changelog id.
        required: true
        schema:
          type: string
      - name: view
        in: query
        description: The view query parameter.
        schema:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.ChangelogView'
          title: view
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Changelog'
  /v1/projects/{project}/instances/{instance}/databases/{database}/changelogs:
    get:
      tags:
      - ChangelogService
      summary: ListChangelogs
      description: 'Lists migration history for a database.

        Permissions required: bb.changelogs.list'
      operationId: ChangelogService_ListChangelogs2
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: instance
        in: path
        description: The instance id.
