openapi: 3.2.0
info:
  title: Bytebase API Reference Setting Service API
  description: API reference for Bytebase. Every endpoint is served by your own Bytebase instance.
  version: 1.0.0
security: []
tags:
- name: SettingService
  description: SettingService manages workspace-level settings and configurations.
paths:
  /v1/settings:
    get:
      tags:
      - SettingService
      summary: ListSettings
      description: 'Lists all workspace settings.

        Permissions required: bb.settings.list'
      operationId: SettingService_ListSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListSettingsResponse'
  /v1/settings/{setting}:
    get:
      tags:
      - SettingService
      summary: GetSetting
      description: 'Retrieves a workspace setting by name.

        Permissions required: bb.settings.get'
      operationId: SettingService_GetSetting
      parameters:
      - name: setting
        in: path
        description: The setting id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Setting'
    patch:
      tags:
      - SettingService
      summary: UpdateSetting
      description: 'Updates a workspace setting.

        Permissions required: bb.settings.set'
      operationId: SettingService_UpdateSetting
      parameters:
      - name: setting
        in: path
        description: The setting id.
        required: true
        schema:
          type: string
      - name: validateOnly
        in: query
        description: "validate_only is a flag to indicate whether to validate the setting value,\n server would not persist the setting value if it is true."
        schema:
          type: boolean
          title: validate_only
      - name: allowMissing
        in: query
        description: The allowMissing query parameter.
        schema:
          type: boolean
          title: allow_missing
      - name: updateMask
        in: query
        description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
        schema:
          type: string
      requestBody:
        description: The setting to update.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.Setting'
              title: setting
              description: The setting to update.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Setting'
  /v1/workspaces/{workspace}/settings/EMAIL:test:
    post:
      tags:
      - SettingService
      summary: TestEmailSetting
      description: 'Sends a test email using the provided config (without persisting).

        Permissions required: bb.settings.set'
      operationId: SettingService_TestEmailSetting
      parameters:
      - name: workspace
        in: path
        description: The workspace id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emailSetting:
                  allOf:
                  - $ref: '#/components/schemas/bytebase.v1.EmailSetting'
                  title: email_setting
                to:
                  type: string
                  title: to
              title: TestEmailSettingRequest
              required:
              - emailSetting
              - to
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.TestEmailSettingResponse'
components:
  schemas:
    google.type.Color:
      type: object
      properties:
        red:
          type: number
          title: red
          format: float
          description: The amount of red in the color as a value in the interval [0, 1].
        green:
          type: number
          title: green
          format: float
          description: The amount of green in the color as a value in the interval [0, 1].
        blue:
          type: number
          title: blue
          format: float
          description: The amount of blue in the color as a value in the interval [0, 1].
        alpha:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.FloatValue'
          title: alpha
          description: "The fraction of this color that should be applied to the pixel. That is,\n the final pixel color is defined by the equation:\n\n   `pixel color = alpha * (this color) + (1.0 - alpha) * (background color)`\n\n This means that a value of 1.0 corresponds to a solid color, whereas\n a value of 0.0 corresponds to a completely transparent color. This\n uses a wrapper message rather than a simple float scalar so that it is\n possible to distinguish between a default value and the value being unset.\n If omitted, this color object is rendered as a solid color\n (as if the alpha value had been explicitly given a value of 1.0)."
      title: Color
      additionalProperties: false
      description: "Represents a color in the RGBA color space. This representation is designed\n for simplicity of conversion to/from color representations in various\n languages over compactness. For example, the fields of this representation\n can be trivially provided to the constructor of `java.awt.Color` in Java; it\n can also be trivially provided to UIColor's `+colorWithRed:green:blue:alpha`\n method in iOS; and, with just a little work, it can be easily formatted into\n a CSS `rgba()` string in JavaScript.\n\n This reference page doesn't carry information about the absolute color\n space\n that should be used to interpret the RGB value (e.g. sRGB, Adobe RGB,\n DCI-P3, BT.2020, etc.). By default, applications should assume the sRGB color\n space.\n\n When color equality needs to be decided, implementations, unless\n documented otherwise, treat two colors as equal if all their red,\n green, blue, and alpha values each differ by at most 1e-5.\n\n Example (Java):\n\n      import com.google.type.Color;\n\n      // ...\n      public static java.awt.Color fromProto(Color protocolor) {\n        float alpha = protocolor.hasAlpha()\n            ? protocolor.getAlpha().getValue()\n            : 1.0;\n\n        return new java.awt.Color(\n            protocolor.getRed(),\n            protocolor.getGreen(),\n            protocolor.getBlue(),\n            alpha);\n      }\n\n      public static Color toProto(java.awt.Color color) {\n        float red = (float) color.getRed();\n        float green = (float) color.getGreen();\n        float blue = (float) color.getBlue();\n        float denominator = 255.0;\n        Color.Builder resultBuilder =\n            Color\n                .newBuilder()\n                .setRed(red / denominator)\n                .setGreen(green / denominator)\n                .setBlue(blue / denominator);\n        int alpha = color.getAlpha();\n        if (alpha != 255) {\n          result.setAlpha(\n              FloatValue\n                  .newBuilder()\n                  .setValue(((float) alpha) / denominator)\n                  .build());\n        }\n        return resultBuilder.build();\n      }\n      // ...\n\n Example (iOS / Obj-C):\n\n      // ...\n      static UIColor* fromProto(Color* protocolor) {\n         float red = [protocolor red];\n         float green = [protocolor green];\n         float blue = [protocolor blue];\n         FloatValue* alpha_wrapper = [protocolor alpha];\n         float alpha = 1.0;\n         if (alpha_wrapper != nil) {\n           alpha = [alpha_wrapper value];\n         }\n         return [UIColor colorWithRed:red green:green blue:blue alpha:alpha];\n      }\n\n      static Color* toProto(UIColor* color) {\n          CGFloat red, green, blue, alpha;\n          if (![color getRed:&red green:&green blue:&blue alpha:&alpha]) {\n            return nil;\n          }\n          Color* result = [[Color alloc] init];\n          [result setRed:red];\n          [result setGreen:green];\n          [result setBlue:blue];\n          if (alpha <= 0.9999) {\n            [result setAlpha:floatWrapperWithValue(alpha)];\n          }\n          [result autorelease];\n          return result;\n     }\n     // ...\n\n  Example (JavaScript):\n\n     // ...\n\n     var protoToCssColor = function(rgb_color) {\n        var redFrac = rgb_color.red || 0.0;\n        var greenFrac = rgb_color.green || 0.0;\n        var blueFrac = rgb_color.blue || 0.0;\n        var red = Math.floor(redFrac * 255);\n        var green = Math.floor(greenFrac * 255);\n        var blue = Math.floor(blueFrac * 255);\n\n        if (!('alpha' in rgb_color)) {\n           return rgbToCssColor(red, green, blue);\n        }\n\n        var alphaFrac = rgb_color.alpha.value || 0.0;\n        var rgbParams = [red, green, blue].join(',');\n        return ['rgba(', rgbParams, ',', alphaFrac, ')'].join('');\n     };\n\n     var rgbToCssColor = function(red, green, blue) {\n       var rgbNumber = new Number((red << 16) | (green << 8) | blue);\n       var hexString = rgbNumber.toString(16);\n       var missingZeros = 6 - hexString.length;\n       var resultBuilder = ['#'];\n       for (var i = 0; i < missingZeros; i++) {\n          resultBuilder.push('0');\n       }\n       resultBuilder.push(hexString);\n       return resultBuilder.join('');\n     };\n\n     // ..."
    bytebase.v1.SemanticTypeSetting:
      type: object
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.SemanticTypeSetting.SemanticType'
          title: types
      title: SemanticTypeSetting
      additionalProperties: false
    bytebase.v1.AppIMSetting:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.AppIMSetting.IMSetting'
