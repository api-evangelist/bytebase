      title: AppIMSetting
      additionalProperties: false
    bytebase.v1.Algorithm.RangeMask:
      type: object
      properties:
        slices:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Algorithm.RangeMask.Slice'
          title: slices
          description: "We store it as a repeated field to face the fact that the original value may have multiple parts should be masked.\n But frontend can be started with a single rule easily."
      title: RangeMask
      additionalProperties: false
    bytebase.v1.ApprovalTemplate:
      type: object
      properties:
        flow:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.ApprovalFlow'
          title: flow
          description: The approval flow definition.
        title:
          type: string
          title: title
          description: The title of the approval template.
        description:
          type: string
          title: description
          description: The description of the approval template.
      title: ApprovalTemplate
      additionalProperties: false
    bytebase.v1.ApprovalFlow:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
          title: roles
          description: The roles required for approval in order.
      title: ApprovalFlow
      additionalProperties: false
    bytebase.v1.AppIMSetting.Teams:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
          description: Azure AD tenant ID (Directory ID).
          writeOnly: true
        clientId:
          type: string
          title: client_id
          description: Azure AD application (client) ID.
          writeOnly: true
        clientSecret:
          type: string
          title: client_secret
          description: Azure AD client secret.
          writeOnly: true
      title: Teams
      additionalProperties: false
    bytebase.v1.WorkspaceProfileSetting.PasswordRestriction:
      type: object
      properties:
        minLength:
          type: integer
          title: min_length
          format: int32
          description: min_length is the minimum length for password, should no less than 8.
        requireNumber:
          type: boolean
          title: require_number
          description: require_number requires the password must contains at least one number.
        requireLetter:
          type: boolean
          title: require_letter
          description: require_letter requires the password must contains at least one letter, regardless of upper case or lower case
        requireUppercaseLetter:
          type: boolean
          title: require_uppercase_letter
          description: require_uppercase_letter requires the password must contains at least one upper case letter.
        requireSpecialCharacter:
          type: boolean
          title: require_special_character
          description: require_special_character requires the password must contains at least one special character.
        requireResetPasswordForFirstLogin:
          type: boolean
          title: require_reset_password_for_first_login
          description: require_reset_password_for_first_login requires users to reset their password after the 1st login.
        passwordRotation:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Duration'
          title: password_rotation
          description: password_rotation requires users to reset their password after the duration.
      title: PasswordRestriction
      additionalProperties: false
    bytebase.v1.WebhookType:
      type: string
      title: WebhookType
      enum:
      - WEBHOOK_TYPE_UNSPECIFIED
      - SLACK
      - DISCORD
      - TEAMS
      - DINGTALK
      - FEISHU
      - WECOM
      - LARK
      - GOOGLE_CHAT
      description: Webhook integration type.
    bytebase.v1.AppIMSetting.Wecom:
      type: object
      properties:
        corpId:
          type: string
          title: corp_id
          writeOnly: true
        agentId:
          type: string
          title: agent_id
          writeOnly: true
        secret:
          type: string
          title: secret
          writeOnly: true
      title: Wecom
      additionalProperties: false
    bytebase.v1.AppIMSetting.Feishu:
      type: object
      properties:
        appId:
          type: string
          title: app_id
          writeOnly: true
        appSecret:
          type: string
          title: app_secret
          writeOnly: true
      title: Feishu
      additionalProperties: false
    google.type.Expr:
      type: object
      properties:
        expression:
          type: string
          title: expression
          description: "Textual representation of an expression in Common Expression Language\n syntax."
        title:
          type: string
          title: title
          description: "Optional. Title for the expression, i.e. a short string describing\n its purpose. This can be used e.g. in UIs which allow to enter the\n expression."
        description:
          type: string
          title: description
          description: "Optional. Description of the expression. This is a longer text which\n describes the expression, e.g. when hovered over it in a UI."
        location:
          type: string
          title: location
          description: "Optional. String indicating the location of the expression for error\n reporting, e.g. a file name and a position in the file."
      title: Expr
      additionalProperties: false
      description: "Represents a textual expression in the Common Expression Language (CEL)\n syntax. CEL is a C-like expression language. The syntax and semantics of CEL\n are documented at https://github.com/google/cel-spec.\n\n Example (Comparison):\n\n     title: \"Summary size limit\"\n     description: \"Determines if a summary is less than 100 chars\"\n     expression: \"document.summary.size() < 100\"\n\n Example (Equality):\n\n     title: \"Requestor is owner\"\n     description: \"Determines if requestor is the document owner\"\n     expression: \"document.owner == request.auth.claims.email\"\n\n Example (Logic):\n\n     title: \"Public documents\"\n     description: \"Determine whether the document should be publicly visible\"\n     expression: \"document.type != 'private' && document.type != 'internal'\"\n\n Example (Data Manipulation):\n\n     title: \"Notification string\"\n     description: \"Create a notification string with a timestamp.\"\n     expression: \"'New message received at ' + string(document.create_time)\"\n\n The exact variables and functions that may be referenced within an expression\n are determined by the service that evaluates it. See the service\n documentation for additional information."
    bytebase.v1.DataClassificationSetting.DataClassificationConfig.DataClassification:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the classification id in [0-9]+-[0-9]+-[0-9]+ format.
        title:
          type: string
          title: title
        level:
          type:
          - integer
          - 'null'
          title: level
          format: int32
          description: The sensitivity level. Maps to Level.level.
      title: DataClassification
      additionalProperties: false
    google.protobuf.FloatValue:
      oneOf:
      - type: string
      - type: number
      description: A single-precision number. The non-finite values `NaN`, `Infinity`, and `-Infinity` are encoded as strings; `null` is also accepted.
    bytebase.v1.DataClassificationSetting:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.DataClassificationSetting.DataClassificationConfig'
          title: configs
      title: DataClassificationSetting
      additionalProperties: false
    bytebase.v1.DataClassificationSetting.DataClassificationConfig:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the uuid for classification. Each project can chose one classification config.
        title:
          type: string
          title: title
        levels:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.DataClassificationSetting.DataClassificationConfig.Level'
          title: levels
          description: levels is user defined level list for classification.
        classification:
          type: object
          title: classification
          additionalProperties:
            allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataClassificationSetting.DataClassificationConfig.DataClassification'
            title: value
          description: "classification is the id - DataClassification map.\n The id should in [0-9]+-[0-9]+-[0-9]+ format."
      title: DataClassificationConfig
      additionalProperties: false
    bytebase.v1.MCPSetting.Capability:
      type: string
      title: Capability
      enum:
      - CAPABILITY_UNSPECIFIED
      - DISABLED
      - READ_ONLY
      - READ_WRITE
      description: "Capability is the ceiling: a session runs at this level or lower.\n Writing CAPABILITY_UNSPECIFIED, explicitly or by leaving\n value.mcp.capability out of the update mask, is rejected."
    bytebase.v1.EmailSetting.SMTPConfig.Authentication:
      type: string
      title: Authentication
      enum:
      - AUTHENTICATION_UNSPECIFIED
      - AUTHENTICATION_NONE
      - PLAIN
      - LOGIN
      - CRAM_MD5
    bytebase.v1.EnvironmentSetting:
      type: object
      properties:
        environments:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.EnvironmentSetting.Environment'
          title: environments
      title: EnvironmentSetting
      additionalProperties: false
    bytebase.v1.WorkspaceProfileSetting:
      type: object
      properties:
        externalUrl:
          type: string
          title: external_url
          description: The external URL is used for sso authentication callback.
        disallowSignup:
          type: boolean
          title: disallow_signup
          description: Disallow self-service signup, users can only be invited by the owner.
        requireMfa:
          type: boolean
          title: require_mfa
          description: Require MFA for all users.
        refreshTokenDuration:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Duration'
          title: refresh_token_duration
          description: The duration for refresh token. Default is 7 days.
        announcement:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.Announcement'
          title: announcement
          description: The setting of custom announcement
        maximumRequestExpiration:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Duration'
          title: maximum_request_expiration
          description: The max expiration duration for data access requests.
        domains:
          type: array
          items:
            type: string
          title: domains
          description: The workspace domain, e.g., bytebase.com.
        enforceIdentityDomain:
          type: boolean
          title: enforce_identity_domain
          description: Only user and group from the domains can be created and login.
        databaseChangeMode:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.DatabaseChangeMode'
          title: database_change_mode
          description: The workspace database change mode.
        disallowPasswordSignin:
          type: boolean
          title: disallow_password_signin
          description: Whether password sign-in is disabled for all end users.
        enableMetricCollection:
          type: boolean
          title: enable_metric_collection
          description: Whether to enable metric collection for the workspace.
        inactiveSessionTimeout:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Duration'
          title: inactive_session_timeout
          description: The session expiration time if not activity detected for the user. Value <= 0 means no limit.
        enableAuditLogStdout:
          type: boolean
          title: enable_audit_log_stdout
          description: "Whether to enable audit logging to stdout in structured JSON format.\n Requires TEAM or ENTERPRISE license."
        watermark:
          type: boolean
          title: watermark
          description: "Whether to display watermark on pages.\n Requires ENTERPRISE license."
        passwordRestriction:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.WorkspaceProfileSetting.PasswordRestriction'
          title: password_restriction
          description: Password restriction settings.
        accessTokenDuration:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Duration'
          title: access_token_duration
          description: The duration for access token. Default is 1 hour.
        enableDebug:
          type: boolean
          title: enable_debug
          description: Whether debug mode is enabled.
        sqlResultSize:
          type: string
          title: sql_result_size
          format: int64
          description: "The maximum result size limit in bytes for query and export, works for the SQL Editor and Export Center.\n The default value is 100MB, we will use the default value if the setting not exists, or the limit <= 0."
        queryTimeout:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Duration'
          title: query_timeout
          description: The query timeout duration for query and export, works for the SQL Editor and Export Center.
        allowEmailCodeSignin:
          type: boolean
          title: allow_email_code_signin
          description: "Allow signin/signup using email + a 6-digit one-time verification code.\n Requires the EMAIL setting to be configured on the workspace."
        sqlEditorThemeId:
          type: string
          title: sql_editor_theme_id
          description: "Enforced SQL Editor theme id: OPAQUE — a frontend-resolved built-in preset id\n OR a custom theme's uuid. Empty ⇒ default light."
        sqlEditorCustomTheme:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.SQLEditorThemeSetting'
          title: sql_editor_custom_theme
          description: "The enforced CUSTOM theme's full definition — present ONLY when\n sql_editor_theme_id is a custom uuid. tokens is always complete."
        maximumRoleExpiration:
          allOf:
          - $ref: '#/components/schemas/google.protobuf.Duration'
          title: maximum_role_expiration
          description: "The max expiration duration for request role.\n Deprecated: use just-in-time access request flows instead."
        directorySyncTokenConfigured:
          type: boolean
          title: directory_sync_token_configured
          description: "Whether a directory sync token has been generated for this workspace.\n The token itself is never returned; this only lets the UI decide between\n offering \"generate\" and \"regenerate\"."
          readOnly: true
      title: WorkspaceProfileSetting
      additionalProperties: false
    bytebase.v1.Algorithm.InnerOuterMask:
      type: object
      properties:
        prefixLen:
          type: integer
          title: prefix_len
          format: int32
        suffixLen:
          type: integer
          title: suffix_len
          format: int32
        type:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.Algorithm.InnerOuterMask.MaskType'
          title: type
        substitution:
          type: string
          title: substitution
      title: InnerOuterMask
      additionalProperties: false
    bytebase.v1.AppIMSetting.DingTalk:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
          writeOnly: true
        clientSecret:
          type: string
          title: client_secret
          writeOnly: true
        robotCode:
          type: string
          title: robot_code
          writeOnly: true
      title: DingTalk
      additionalProperties: false
    bytebase.v1.AppIMSetting.Slack:
      type: object
      properties:
        token:
          type: string
          title: token
          writeOnly: true
      title: Slack
      additionalProperties: false
    bytebase.v1.DatabaseChangeMode:
      type: string
      title: DatabaseChangeMode
      enum:
      - DATABASE_CHANGE_MODE_UNSPECIFIED
      - PIPELINE
      - EDITOR
    bytebase.v1.Algorithm.RangeMask.Slice:
      type: object
      properties:
        start:
          type: integer
          title: start
          format: int32
          description: "start is the start character index (0-based) of the original value, should be less than end.\n Uses character indices (not byte offsets) for display-oriented masking.\n Example: For \"你好world\", character index 2 refers to 'w' (the 3rd character)."
        end:
          type: integer
          title: end
          format: int32
          description: "end is the end character index (exclusive) of the original value.\n Uses character indices (not byte offsets) for display-oriented masking."
        substitution:
          type: string
          title: substitution
          description: substitution is the string used to replace the OriginalValue[start:end).
      title: Slice
      additionalProperties: false
    bytebase.v1.Announcement.AnnouncementTheme:
      type: object
      properties:
        background:
          allOf:
          - $ref: '#/components/schemas/google.type.Color'
          title: background
        text:
          allOf:
          - $ref: '#/components/schemas/google.type.Color'
          title: text
      title: AnnouncementTheme
      additionalProperties: false
    bytebase.v1.WorkspaceApprovalSetting.Rule.Source:
      type: string
      title: Source
      enum:
      - SOURCE_UNSPECIFIED
      - CHANGE_DATABASE
      - CREATE_DATABASE
      - REQUEST_ROLE
      - REQUEST_ACCESS
    bytebase.v1.WorkspaceApprovalSetting.Rule:
      type: object
      properties:
        template:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.ApprovalTemplate'
          title: template
        condition:
          allOf:
          - $ref: '#/components/schemas/google.type.Expr'
          title: condition
          description: "The condition that is associated with the rule.\n The syntax and semantics of CEL are documented at https://github.com/google/cel-spec\n\n The `source` field filters which rules apply. The `condition` field then evaluates with full context.\n\n All supported variables:\n statement.affected_rows: affected row count in the DDL/DML, support \"==\", \"!=\", \"<\", \"<=\", \">\", \">=\" operations.\n statement.table_rows: table row count number, support \"==\", \"!=\", \"<\", \"<=\", \">\", \">=\" operations.\n resource.environment_id: the environment resource id, support \"==\", \"!=\", \"in [xx]\", \"!(in [xx])\" operations.\n resource.project_id: the project resource id, support \"==\", \"!=\", \"in [xx]\", \"!(in [xx])\", \"contains()\", \"matches()\", \"startsWith()\", \"endsWith()\" operations.\n resource.db_engine: the database engine type, support \"==\", \"!=\", \"in [xx]\", \"!(in [xx])\" operations. Check the Engine enum for values.\n statement.sql_type: the SQL type, support \"==\", \"!=\", \"in [xx]\", \"!(in [xx])\" operations.\n resource.database_name: the database name, support \"==\", \"!=\", \"in [xx]\", \"!(in [xx])\", \"contains()\", \"matches()\", \"startsWith()\", \"endsWith()\" operations.\n resource.schema_name: the schema name, support \"==\", \"!=\", \"in [xx]\", \"!(in [xx])\", \"contains()\", \"matches()\", \"startsWith()\", \"endsWith()\" operations.\n resource.table_name: the table name, support \"==\", \"!=\", \"in [xx]\", \"!(in [xx])\", \"contains()\", \"matches()\", \"startsWith()\", \"endsWith()\" operations.\n statement.text: the SQL statement, support \"contains()\", \"matches()\", \"startsWith()\", \"endsWith()\" operations.\n request.expiration_days: the role expiration days for the request, support \"==\", \"!=\", \"<\", \"<=\", \">\", \">=\" operations.\n request.role: the request role full name, support \"==\", \"!=\", \"in [xx]\", \"!(in [xx])\", \"contains()\", \"matches()\", \"startsWith()\", \"endsWith()\" operations.\n\n When source is CHANGE_DATABASE, support: statement.*, resource.* (excluding request.*)\n When source is CREATE_DATABASE, support: resource.environment_id, resource.project_id, resource.db_engine, resource.database_name\n When source is REQUEST_ROLE, support: resource.project_id, request.expiration_days, request.role\n When source is REQUEST_ACCESS, support: resource.environment_id, resource.project_id, resource.db_engine, resource.database_name, resource.schema_name, resource.table_name, request.unmask, request.data_export\n\n For examples:\n resource.environment_id == \"prod\" && statement.affected_rows >= 100\n resource.table_name.matches(\"sensitive_.*\") && resource.db_engine == \"MYSQL\""
        source:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.WorkspaceApprovalSetting.Rule.Source'
          title: source
      title: Rule
      additionalProperties: false
