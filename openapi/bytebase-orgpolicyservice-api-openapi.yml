              description: The policy to create.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Policy'
  /v1/projects/{project}/policies/{policy}:
    get:
      tags:
      - OrgPolicyService
      summary: GetPolicy
      description: 'Retrieves a policy by name.

        Permissions required: bb.policies.get'
      operationId: OrgPolicyService_GetPolicy2
      parameters:
      - name: project
