          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Policy'
    delete:
      tags:
      - OrgPolicyService
      summary: DeletePolicy
      description: 'Deletes an organizational policy.

        Permissions required: bb.policies.delete'
      operationId: OrgPolicyService_DeletePolicy2
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
      - name: policy
        in: path
        description: The policy id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
    patch:
      tags:
      - OrgPolicyService
      summary: UpdatePolicy
      description: 'Updates an existing organizational policy.

        Permissions required: bb.policies.update'
      operationId: OrgPolicyService_UpdatePolicy2
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
