openapi: 3.2.0
info:
  title: Bytebase API Reference Org Policy Service API
  description: API reference for Bytebase. Every endpoint is served by your own Bytebase instance.
  version: 1.0.0
security: []
tags:
- name: OrgPolicyService
  description: OrgPolicyService manages organizational policies at various resource levels.
paths:
  /v1/environments/{environment}/policies:
    get:
      tags:
      - OrgPolicyService
      summary: ListPolicies
      description: 'Lists policies at a specified resource level.

        Permissions required: bb.policies.list'
      operationId: OrgPolicyService_ListPolicies3
      parameters:
      - name: environment
        in: path
        description: The environment id.
        required: true
        schema:
          type: string
      - name: policyType
        in: query
        description: Filter by specific policy type.
        schema:
          oneOf:
          - $ref: '#/components/schemas/bytebase.v1.PolicyType'
          - type: 'null'
          title: policy_type
      - name: showDeleted
        in: query
        description: Show deleted policies if specified.
        schema:
          type: boolean
          title: show_deleted
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListPoliciesResponse'
    post:
      tags:
      - OrgPolicyService
      summary: CreatePolicy
      description: 'Creates a new organizational policy.

        Permissions required: bb.policies.create'
      operationId: OrgPolicyService_CreatePolicy3
      parameters:
      - name: environment
        in: path
        description: The environment id.
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: The type of policy to create.
        schema:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.PolicyType'
          title: type
      requestBody:
        description: The policy to create.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.Policy'
              title: policy
              description: The policy to create.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Policy'
  /v1/environments/{environment}/policies/{policy}:
    get:
      tags:
      - OrgPolicyService
      summary: GetPolicy
      description: 'Retrieves a policy by name.

        Permissions required: bb.policies.get'
      operationId: OrgPolicyService_GetPolicy3
      parameters:
      - name: environment
        in: path
        description: The environment id.
        required: true
        schema:
          type: string
      - name: policy
        in: path
        description: The policy id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Policy'
    delete:
      tags:
      - OrgPolicyService
      summary: DeletePolicy
      description: 'Deletes an organizational policy.

        Permissions required: bb.policies.delete'
      operationId: OrgPolicyService_DeletePolicy3
      parameters:
      - name: environment
        in: path
        description: The environment id.
        required: true
        schema:
          type: string
      - name: policy
        in: path
        description: The policy id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
    patch:
      tags:
      - OrgPolicyService
      summary: UpdatePolicy
      description: 'Updates an existing organizational policy.

        Permissions required: bb.policies.update'
      operationId: OrgPolicyService_UpdatePolicy3
      parameters:
      - name: environment
        in: path
        description: The environment id.
        required: true
        schema:
          type: string
      - name: policy
        in: path
        description: The policy id.
        required: true
        schema:
          type: string
      - name: updateMask
        in: query
        description: The list of fields to update.
        schema:
          type: string
      - name: allowMissing
        in: query
        description: "If set to true, and the policy is not found, a new policy will be created.\n In this situation, `update_mask` is ignored."
        schema:
          type: boolean
          title: allow_missing
      requestBody:
        description: "The policy to update.\n\n The policy's `name` field is used to identify the instance to update.\n Format: {resource name}/policies/{policy type}\n Workspace resource name: workspaces/{workspace-id}.\n Environment resource name: environments/environment-id."
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.Policy'
              title: policy
              description: "The policy to update.\n\n The policy's `name` field is used to identify the instance to update.\n Format: {resource name}/policies/{policy type}\n Workspace resource name: workspaces/{workspace-id}.\n Environment resource name: environments/environment-id."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Policy'
