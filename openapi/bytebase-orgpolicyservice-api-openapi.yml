          title: allow_missing
      requestBody:
        description: "The policy to update.\n\n The policy's `name` field is used to identify the instance to update.\n Format: {resource name}/policies/{policy type}\n Workspace resource name: workspaces/{workspace-id}.\n Environment resource name: environments/environment-id."
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.Policy'
              title: policy
              description: "The policy to update.\n\n The policy's `name` field is used to identify the instance to update.\n Format: {resource name}/policies/{policy type}\n Workspace resource name: workspaces/{workspace-id}.\n Environment resource name: environments/environment-id."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Policy'
