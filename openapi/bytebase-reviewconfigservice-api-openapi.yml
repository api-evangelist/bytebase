openapi: 3.2.0
info:
  title: Bytebase API Reference Review Config Service API
  description: API reference for Bytebase. Every endpoint is served by your own Bytebase instance.
  version: 1.0.0
security: []
tags:
- name: ReviewConfigService
  description: ReviewConfigService manages approval flow configurations.
paths:
  /v1/reviewConfigs:
    get:
      tags:
      - ReviewConfigService
      summary: ListReviewConfigs
      description: 'Lists all SQL review configurations.

        Permissions required: bb.reviewConfigs.list'
      operationId: ReviewConfigService_ListReviewConfigs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListReviewConfigsResponse'
    post:
      tags:
      - ReviewConfigService
      summary: CreateReviewConfig
      description: 'Creates a new SQL review configuration.

        Permissions required: bb.reviewConfigs.create'
      operationId: ReviewConfigService_CreateReviewConfig
      requestBody:
        description: The SQL review config to create.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.ReviewConfig'
              title: review_config
              description: The SQL review config to create.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ReviewConfig'
  /v1/reviewConfigs/{reviewConfig}:
    get:
      tags:
      - ReviewConfigService
      summary: GetReviewConfig
      description: 'Retrieves a SQL review configuration by name.

        Permissions required: bb.reviewConfigs.get'
      operationId: ReviewConfigService_GetReviewConfig
      parameters:
      - name: reviewConfig
        in: path
        description: The reviewConfig id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ReviewConfig'
    delete:
      tags:
      - ReviewConfigService
      summary: DeleteReviewConfig
      description: 'Deletes a SQL review configuration.

        Permissions required: bb.reviewConfigs.delete'
      operationId: ReviewConfigService_DeleteReviewConfig
      parameters:
      - name: reviewConfig
        in: path
        description: The reviewConfig id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
    patch:
      tags:
      - ReviewConfigService
      summary: UpdateReviewConfig
      description: 'Updates a SQL review configuration.

        Permissions required: bb.reviewConfigs.update

        When allow_missing=true, also requires: bb.reviewConfigs.create'
      operationId: ReviewConfigService_UpdateReviewConfig
      parameters:
      - name: reviewConfig
        in: path
        description: The reviewConfig id.
        required: true
        schema:
          type: string
      - name: updateMask
        in: query
        description: The list of fields to update.
        schema:
          type: string
      - name: allowMissing
        in: query
        description: "If set to true, and the config is not found, a new config will be created.\n In this situation, `update_mask` is ignored."
        schema:
          type: boolean
          title: allow_missing
      requestBody:
        description: "The SQL review config to update.\n\n The name field is used to identify the SQL review config to update."
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.ReviewConfig'
              title: review_config
              description: "The SQL review config to update.\n\n The name field is used to identify the SQL review config to update."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ReviewConfig'
components:
  schemas:
    bytebase.v1.SQLReviewRule.CommentConventionRulePayload:
      type: object
      properties:
        required:
          type: boolean
          title: required
        maxLength:
          type: integer
          title: max_length
          format: int32
      title: CommentConventionRulePayload
      additionalProperties: false
    bytebase.v1.SQLReviewRule:
      type: object
      anyOf:
      - type: object
        properties:
          commentConventionPayload:
            allOf:
            - $ref: '#/components/schemas/bytebase.v1.SQLReviewRule.CommentConventionRulePayload'
            title: comment_convention_payload
        title: comment_convention_payload
      - type: object
        properties:
          namingCasePayload:
            allOf:
            - $ref: '#/components/schemas/bytebase.v1.SQLReviewRule.NamingCaseRulePayload'
            title: naming_case_payload
        title: naming_case_payload
      - type: object
        properties:
          namingPayload:
            allOf:
            - $ref: '#/components/schemas/bytebase.v1.SQLReviewRule.NamingRulePayload'
            title: naming_payload
        title: naming_payload
      - type: object
        properties:
          numberPayload:
            allOf:
            - $ref: '#/components/schemas/bytebase.v1.SQLReviewRule.NumberRulePayload'
            title: number_payload
        title: number_payload
      - type: object
        properties:
          stringArrayPayload:
            allOf:
            - $ref: '#/components/schemas/bytebase.v1.SQLReviewRule.StringArrayRulePayload'
            title: string_array_payload
        title: string_array_payload
      - type: object
        properties:
          stringPayload:
            allOf:
            - $ref: '#/components/schemas/bytebase.v1.SQLReviewRule.StringRulePayload'
            title: string_payload
        title: string_payload
      unevaluatedProperties: false
      not:
        allOf:
        - anyOf:
          - required:
            - commentConventionPayload
          - required:
            - namingCasePayload
          - required:
            - namingPayload
          - required:
            - numberPayload
          - required:
            - stringArrayPayload
          - required:
            - stringPayload
        - not:
            oneOf:
            - required:
              - commentConventionPayload
            - required:
              - namingCasePayload
            - required:
              - namingPayload
            - required:
              - numberPayload
            - required:
              - stringArrayPayload
            - required:
              - stringPayload
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.SQLReviewRule.Type'
          title: type
          description: The type of SQL review rule.
        level:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.SQLReviewRule.Level'
          title: level
          description: The severity level of the rule.
        engine:
          allOf:
          - $ref: '#/components/schemas/bytebase.v1.Engine'
          title: engine
          description: The database engine this rule applies to.
      title: SQLReviewRule
      description: SQL review rule configuration. Check the SQL_REVIEW_RULES_DOCUMENTATION.md for details.
    bytebase.v1.SQLReviewRule.NumberRulePayload:
      type: object
      properties:
        number:
          type: integer
          title: number
          format: int32
      title: NumberRulePayload
      additionalProperties: false
    bytebase.v1.SQLReviewRule.StringArrayRulePayload:
      type: object
      properties:
        list:
          type: array
          items:
            type: string
          title: list
      title: StringArrayRulePayload
      additionalProperties: false
    bytebase.v1.SQLReviewRule.Level:
      type: string
      title: Level
      enum:
      - LEVEL_UNSPECIFIED
      - ERROR
      - WARNING
      description: The severity level for SQL review rules.
    bytebase.v1.ListReviewConfigsResponse:
      type: object
      properties:
        reviewConfigs:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.ReviewConfig'
          title: review_configs
          description: The SQL review configs from the specified request.
      title: ListReviewConfigsResponse
      additionalProperties: false
    bytebase.v1.SQLReviewRule.NamingCaseRulePayload:
      type: object
      properties:
        upper:
          type: boolean
          title: upper
      title: NamingCaseRulePayload
      additionalProperties: false
    bytebase.v1.ReviewConfig:
      type: object
      properties:
        name:
          type: string
          title: name
          description: "The name of the SQL review config.\n Format: reviewConfigs/{reviewConfig}"
          readOnly: true
        title:
          type: string
          title: title
          maxLength: 200
          description: The title of the review configuration.
        enabled:
          type: boolean
          title: enabled
          description: Whether the review configuration is enabled.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.SQLReviewRule'
          title: rules
          description: The SQL review rules to enforce.
        resources:
          type: array
          items:
            type: string
          title: resources
          description: "Resources using the config.\n Format: {resource}/{resource id}, e.g., environments/test."
      title: ReviewConfig
      additionalProperties: false
    bytebase.v1.SQLReviewRule.Type:
      type: string
      title: Type
      enum:
