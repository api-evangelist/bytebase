openapi: 3.2.0
info:
  title: Bytebase API Reference Instance Service API
  description: API reference for Bytebase. Every endpoint is served by your own Bytebase instance.
  version: 1.0.0
security: []
tags:
- name: InstanceService
  description: InstanceService manages database instances and their connections.
paths:
  /v1/instances:
    get:
      tags:
      - InstanceService
      summary: ListInstances
      description: 'Lists database instances, optionally within a project.

        Permissions required: bb.instances.list'
      operationId: InstanceService_ListInstances
      parameters:
      - name: parent
        in: query
        description: "The parent, which owns this collection of instances.\n Format: projects/{project}. If omitted, only workspace instances are\n returned. Wildcard project parents are not supported. When set, the\n `project` filter must be omitted or match this parent."
        schema:
          type: string
          title: parent
      - name: pageSize
        in: query
        description: "The maximum number of instances to return. The service may return fewer than\n this value.\n If unspecified, at most 10 instances will be returned.\n The maximum value is 1000; values above 1000 will be coerced to 1000."
        schema:
          type: integer
          title: page_size
          format: int32
      - name: pageToken
        in: query
        description: "A page token, received from a previous `ListInstances` call.\n Provide this to retrieve the subsequent page.\n\n When paginating, all other parameters provided to `ListInstances` must match\n the call that provided the page token."
        schema:
          type: string
          title: page_token
      - name: showDeleted
        in: query
        description: Show deleted instances if specified.
        schema:
          type: boolean
          title: show_deleted
      - name: filter
        in: query
        description: "Filter the instance.\n The syntax and semantics of CEL are documented at https://github.com/google/cel-spec\n\n Supported filters:\n - name: the instance name, support \"==\" and \".contains()\" operator.\n - resource_id: the instance id, support \"==\" and \".contains()\" operator.\n - environment: the environment full name in \"environments/{id}\" format, support \"==\" operator.\n - state: the instance state, check State enum for values, support \"==\" operator.\n - engine: the instance engine, check Engine enum for values. Support \"==\", \"in [xx]\", \"!(in [xx])\" operator.\n - host: the instance host, support \"==\" and \".contains()\" operator.\n - port: the instance port, support \"==\" and \".contains()\" operator.\n - project: the project full name in \"projects/{id}\" format, support \"==\" operator.\n - labels.{key}: the instance label, support \"==\" and \"in\" operators.\n\n For example:\n name == \"sample instance\"\n name.contains(\"sample\")\n resource_id == \"sample-instance\"\n resource_id.contains(\"sample\")\n state == \"DELETED\"\n environment == \"environments/test\"\n environment == \"\" (find instances which environment is not set)\n engine == \"MYSQL\"\n engine in [\"MYSQL\", \"POSTGRES\"]\n !(engine in [\"MYSQL\", \"POSTGRES\"])\n host == \"127.0.0.1\"\n host.contains(\"127.0\")\n port == \"54321\"\n port.contains(\"543\")\n labels.org_group == \"infrastructure\"\n labels.environment in [\"prod\", \"production\"]\n project == \"projects/sample-project\"\n You can combine filter conditions like:\n name.contains(\"sample\") && environment == \"environments/test\"\n host == \"127.0.0.1\" && port == \"54321\""
        schema:
          type: string
          title: filter
      - name: orderBy
        in: query
        description: "The order by of instances.\n Support title, environment. The default sorting order is ascending.\n For example:\n - order_by = \"title\"\n - order_by = \"title desc\"\n - order_by = \"title desc, environment asc\""
        schema:
          type: string
          title: order_by
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListInstancesResponse'
    post:
      tags:
      - InstanceService
      summary: CreateInstance
      description: 'Creates a new database instance.

        Permissions required: bb.instances.create'
      operationId: InstanceService_CreateInstance
      parameters:
      - name: parent
        in: query
        description: "The parent, which owns this collection of instances.\n Format: projects/{project}. If omitted, the instance is created in the\n workspace collection."
        schema:
          type: string
          title: parent
      - name: instanceId
        in: query
        description: "The ID to use for the instance, which will become the final component of\n the instance's resource name.\n\n This value should be 4-63 characters, and valid characters\n are /[a-z][0-9]-/."
        schema:
          type: string
          title: instance_id
      - name: validateOnly
        in: query
        description: Validate only also tests the data source connection.
        schema:
          type: boolean
          title: validate_only
      requestBody:
        description: The instance to create.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.Instance'
              title: instance
              description: The instance to create.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Instance'
  /v1/instances/{instance}:
    get:
      tags:
      - InstanceService
      summary: GetInstance
      description: 'Gets a database instance by name.

        Permissions required: bb.instances.get'
      operationId: InstanceService_GetInstance
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Instance'
    delete:
      tags:
      - InstanceService
      summary: DeleteInstance
      description: 'Deletes or soft-deletes a database instance.

        Soft-delete requests fail with FAILED_PRECONDITION while any task run

        targeting the instance is pending, available, or running.

        Permissions required: bb.instances.delete'
      operationId: InstanceService_DeleteInstance
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: "If set to true, a workspace instance's databases are moved to the default\n project before the instance is soft-deleted. Project instances reject this\n option because their databases must remain in the owning project."
        schema:
          type: boolean
          title: force
      - name: purge
        in: query
        description: "If set to true, permanently purge the soft-deleted instance and all related resources.\n This operation is irreversible. Following AIP-165, this should only be used for\n administrative cleanup of old soft-deleted instances.\n The instance must already be soft-deleted for this to work."
        schema:
          type: boolean
          title: purge
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
    patch:
      tags:
      - InstanceService
      summary: UpdateInstance
      description: 'Updates a database instance.

        Permissions required: bb.instances.update'
      operationId: InstanceService_UpdateInstance
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: updateMask
        in: query
        description: The list of fields to update.
        schema:
          type: string
      - name: allowMissing
        in: query
        description: "If set to true, and the instance is not found, a new instance will be created.\n In this situation, `update_mask` is ignored. A project-nested name creates\n the instance only under its encoded active, non-default project; it never\n falls back to a workspace instance."
        schema:
          type: boolean
          title: allow_missing
      requestBody:
        description: "The instance to update.\n\n The instance's `name` field is used to identify the instance to update.\n Format: instances/{instance} or projects/{project}/instances/{instance}"
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.Instance'
              title: instance
              description: "The instance to update.\n\n The instance's `name` field is used to identify the instance to update.\n Format: instances/{instance} or projects/{project}/instances/{instance}"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Instance'
  /v1/instances/{instance}:addDataSource:
    post:
      tags:
      - InstanceService
      summary: AddDataSource
      description: 'Adds a read-only data source to an instance.

        Permissions required: bb.instances.update'
      operationId: InstanceService_AddDataSource
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dataSource:
                  allOf:
                  - $ref: '#/components/schemas/bytebase.v1.DataSource'
                  title: data_source
                  description: "Identified by data source ID.\n Only READ_ONLY data source can be added."
                validateOnly:
                  type: boolean
                  title: validate_only
                  description: Validate only also tests the data source connection.
              title: AddDataSourceRequest
              required:
              - dataSource
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Instance'
  /v1/instances/{instance}:databases:
    post:
      tags:
      - InstanceService
      summary: ListInstanceDatabase
      description: 'Lists all databases within an instance without creating them.

        Permissions required: bb.instances.get'
      operationId: InstanceService_ListInstanceDatabase
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instance:
                  oneOf:
                  - $ref: '#/components/schemas/bytebase.v1.Instance'
                  - type: 'null'
                  title: instance
                  description: The target instance. We need to set this field if the target instance is not created yet.
              title: ListInstanceDatabaseRequest
              required:
              - instance
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListInstanceDatabaseResponse'
  /v1/instances/{instance}:removeDataSource:
    post:
      tags:
      - InstanceService
      summary: RemoveDataSource
      description: 'Removes a read-only data source from an instance.

        Permissions required: bb.instances.update'
      operationId: InstanceService_RemoveDataSource
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dataSource:
                  allOf:
                  - $ref: '#/components/schemas/bytebase.v1.DataSource'
                  title: data_source
                  description: "Identified by data source ID.\n Only READ_ONLY data source can be removed."
              title: RemoveDataSourceRequest
              required:
              - dataSource
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Instance'
  /v1/instances/{instance}:sync:
    post:
      tags:
      - InstanceService
      summary: SyncInstance
      description: 'Syncs database schemas and metadata from an instance.

        Permissions required: bb.instances.sync'
      operationId: InstanceService_SyncInstance
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enableFullSync:
                  type: boolean
                  title: enable_full_sync
                  description: "When full sync is enabled, all databases in the instance will be synchronized. Otherwise, only\n the instance metadata (such as the database list) and any newly discovered databases will be synced."
              title: SyncInstanceRequest
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.SyncInstanceResponse'
  /v1/instances/{instance}:undelete:
    post:
      tags:
      - InstanceService
      summary: UndeleteInstance
      description: 'Restores a soft-deleted database instance.

        Restore requests fail with FAILED_PRECONDITION while any task run targeting

        the instance is pending, available, or running.

        Permissions required: bb.instances.undelete'
      operationId: InstanceService_UndeleteInstance
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Instance'
  /v1/instances/{instance}:updateDataSource:
    patch:
      tags:
      - InstanceService
      summary: UpdateDataSource
      description: 'Updates a data source configuration.

        Permissions required: bb.instances.update'
      operationId: InstanceService_UpdateDataSource
      parameters:
      - name: instance
        in: path
        description: The instance id.
        required: true
        schema:
          type: string
      - name: updateMask
        in: query
        description: The list of fields to update.
        schema:
          type: string
      - name: validateOnly
        in: query
        description: Validate only also tests the data source connection.
        schema:
          type: boolean
          title: validate_only
      - name: allowMissing
        in: query
        description: "If set to true, and the data source is not found, a new data source will be created.\n In this situation, `update_mask` is ignored."
        schema:
          type: boolean
          title: allow_missing
      requestBody:
        description: Identified by data source ID.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/bytebase.v1.DataSource'
              title: data_source
              description: Identified by data source ID.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Instance'
  /v1/instances:batchSync:
    post:
      tags:
      - InstanceService
      summary: BatchSyncInstances
      description: 'Syncs multiple instances in a single request.

        Permissions required: bb.instances.sync'
      operationId: InstanceService_BatchSyncInstances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.BatchSyncInstancesRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.BatchSyncInstancesResponse'
  /v1/instances:batchUpdate:
    post:
      tags:
      - InstanceService
      summary: BatchUpdateInstances
      description: 'Updates multiple instances in a single request.

        Permissions required: bb.instances.update'
      operationId: InstanceService_BatchUpdateInstances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.BatchUpdateInstancesRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.BatchUpdateInstancesResponse'
  /v1/projects/{project}/instances:
    get:
      tags:
      - InstanceService
      summary: ListInstances
      description: 'Lists database instances, optionally within a project.

