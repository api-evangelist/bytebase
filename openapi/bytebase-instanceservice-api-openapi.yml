          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListInstancesResponse'
    post:
      tags:
      - InstanceService
      summary: CreateInstance
      description: 'Creates a new database instance.

        Permissions required: bb.instances.create'
      operationId: InstanceService_CreateInstance2
      parameters:
      - name: project
        in: path
        description: The project id.
        required: true
        schema:
          type: string
